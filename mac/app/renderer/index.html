<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>中文程 · 中文编程软件</title>
<!-- 苹果 Web App：Safari 打开 → 分享 → 添加到主屏幕，即变全屏独立 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中文程">
<meta name="theme-color" content="#14181f">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================= 顶部工具栏 ================= -->
<header class="toolbar">
  <div class="brand">
    <span class="brand-logo">中</span>
    <span class="brand-name">中文程</span>
    <span class="brand-sub">个人中文编程软件 · 完全自主开发</span>
  </div>
  <div class="toolbar-actions">
    <button id="btn新建" title="新建文件">新建</button>
    <button id="btn保存" title="保存到本机 (Ctrl+S)">保存</button>
    <button id="btn导出" title="导出 .zy 文件">导出</button>
    <button id="btn导入" title="导入 .zy 文件">导入</button>
    <span class="sep"></span>
    <button id="btn运行" class="primary" title="运行程序 (Ctrl+R)">▶ 运行</button>
    <button id="btn停止" class="danger" disabled title="停止程序">■ 停止</button>
    <span class="sep"></span>
    <select id="方言选择" title="切换中文编程方言（语言）">
      <option value="zh">简体中文程</option>
      <option value="trad">繁体中文程</option>
      <option value="pinyin">拼音中文程</option>
    </select>
    <span class="sep"></span>
    <button id="btn设置" title="软件设置（AI / 命令行 / 账号）">⚙ 设置</button>
  </div>
</header>

<!-- ================= 主体 ================= -->
<main class="main">

  <!-- 左侧：文件栏 -->
  <aside class="sidebar">
    <div class="side-head">
      <span>我的程序</span>
      <button id="btn新建2" title="新建文件">＋</button>
    </div>
    <ul id="用户文件列表" class="file-list"></ul>
    <div class="side-head side-head2"><span>内置示例</span></div>
    <ul id="示例列表" class="file-list"></ul>
  </aside>

  <!-- 中间：编辑器 -->
  <section class="editor-pane">
    <div class="file-tab"><span id="当前文件名">未命名</span><span id="文件状态" class="file-status"></span></div>
    <div id="编辑器容器" class="editor-container"></div>
    <div class="statusbar">
      <span id="状态行列">行 1, 列 1</span>
      <span id="状态方言">简体中文程</span>
      <span id="状态提示"></span>
    </div>
  </section>

  <!-- 右侧：AI 助手 -->
  <aside class="ai-pane">
    <div id="AI面板" class="ai-panel"></div>
  </aside>

</main>

<!-- ================= 底部输出区 ================= -->
<footer class="console-pane">
  <div class="console-tabs">
    <button class="ctab on" data-tab="控制台">控制台</button>
    <button class="ctab" data-tab="画布">画布</button>
    <button class="ctab" data-tab="命令行">命令行</button>
    <button id="清屏按钮" title="清空当前页签">清空</button>
    <button id="收回按钮" title="收回面板，避免挡住界面">▼ 收回</button>
  </div>
  <div id="控制台区" class="console-body"></div>
  <div id="画布区" class="canvas-body" hidden>
    <div id="画布容器"></div>
  </div>
  <div id="命令行区" class="term-body" hidden></div>
</footer>

<!-- ================= 输入弹窗（读入） ================= -->
<div id="输入弹窗" class="modal" hidden>
  <div class="modal-box">
    <div id="输入提示" class="modal-tip">请输入：</div>
    <input id="输入框" type="text">
    <div class="modal-btns"><button id="输入确定" class="primary">确定</button><button id="输入取消">取消</button></div>
  </div>
</div>

<script src="js/dialects.js"></script>
<script src="js/lexer.js"></script>
<script src="js/parser.js"></script>
<script src="js/interpreter.js"></script>
<script src="js/stdlib.js"></script>
<script src="js/files.js"></script>
<script src="js/editor.js"></script>
<script src="js/settings.js"></script>
<script src="js/terminal.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
