<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>中文程 · 中文编程软件</title>
<!-- 苹果 Web App：Safari 打开 → 分享 → 添加到主屏幕，即变全屏独立 App -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="中文程">
<meta name="theme-color" content="#14181f">
<style>/* ============================================================
 * 中文程 · 界面样式 (style.css)
 * ------------------------------------------------------------
 * 完全自主设计的深色 IDE 风格，无任何第三方样式库。
 * ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0e1320;
  --panel: #151c2c;
  --panel2: #1a2234;
  --panel3: #1f2940;
  --border: #28334d;
  --border2: #33405f;
  --text: #d9e2f3;
  --text2: #8b99b8;
  --text3: #5f6d8e;
  --blue: #4f8cff;
  --blue2: #7fb4ff;
  --green: #7ee787;
  --orange: #ffa657;
  --purple: #d2a8ff;
  --red: #ff6b6b;
  --yellow: #e3c565;
}

html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 13px;
}

button {
  font-family: inherit;
  background: var(--panel3);
  color: var(--text);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  font-size: 12px;
  transition: background .15s, border-color .15s;
}
button:hover { background: #273350; border-color: #4a5a80; }
button.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
button.primary:hover { background: #3d7bf0; }
button.danger { background: #3a2430; border-color: #6b3540; color: #ff9a9a; }
button.danger:disabled { opacity: .4; cursor: not-allowed; }
button:disabled { opacity: .5; cursor: not-allowed; }

/* ================= 顶部工具栏 ================= */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand-logo {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, #4f8cff, #7b5cff);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #fff;
}
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
.brand-sub { color: var(--text3); font-size: 11px; }
.toolbar-actions { display: flex; align-items: center; gap: 6px; }
.sep { width: 1px; height: 20px; background: var(--border2); margin: 0 6px; }

select {
  background: var(--panel3); color: var(--text);
  border: 1px solid var(--border2); border-radius: 6px;
  padding: 5px 8px; font-family: inherit; font-size: 12px;
  outline: none;
}

/* ================= 主体布局 ================= */
.main { flex: 1; display: flex; min-height: 0; }

/* ---------- 左侧文件栏 ---------- */
.sidebar {
  width: 192px; flex-shrink: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.side-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 10px 6px;
  color: var(--text2); font-size: 11px; letter-spacing: 1px;
  font-weight: 600;
}
.side-head2 { margin-top: 10px; }
.side-head button {
  padding: 0 7px; font-size: 13px; line-height: 1.4;
  background: transparent; border-color: transparent; color: var(--blue2);
}
.file-list { list-style: none; }
.file-list li {
  padding: 7px 12px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  border-left: 2px solid transparent;
  color: var(--text2);
  user-select: none;
}
.file-list li:hover { background: var(--panel2); color: var(--text); }
.file-list li.on { background: var(--panel3); border-left-color: var(--blue); color: var(--text); }
.file-list li .del {
  visibility: hidden; color: var(--text3); padding: 0 4px; font-size: 12px;
}
.file-list li:hover .del { visibility: visible; }
.file-list li .del:hover { color: var(--red); }
.file-list .f-type { font-size: 10px; color: var(--text3); margin-left: 6px; }

/* ---------- 中间编辑器 ---------- */
.editor-pane {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}
.file-tab {
  padding: 7px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.file-tab #当前文件名 { font-weight: 600; font-size: 12.5px; }
.file-status { color: var(--text3); font-size: 11px; }

.editor-container { flex: 1; min-height: 0; position: relative; }

.editor-shell {
  position: absolute; inset: 0;
  display: flex;
  overflow: hidden;
}
.editor-gutter {
  width: 46px; flex-shrink: 0;
  padding: 12px 8px 12px 0;
  text-align: right;
  color: #46567a;
  font: 14px/20px Consolas, "Microsoft YaHei", monospace;
  overflow: hidden;
  background: #0f1523;
  border-right: 1px solid var(--border);
  user-select: none;
  white-space: pre;
}
.editor-body { position: relative; flex: 1; overflow: hidden; }
.editor-highlight, .editor-input {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  font: 14px/20px Consolas, "Microsoft YaHei", monospace;
  white-space: pre;
  padding: 12px 16px;
  tab-size: 4;
}
.editor-highlight { overflow: hidden; color: #e6edf7; pointer-events: none; }
.editor-input {
  background: transparent;
  color: transparent;
  caret-color: var(--text);
  border: none; outline: none; resize: none;
  overflow: auto;
}
.editor-input::selection { background: rgba(79, 140, 255, .30); color: transparent; }
.editor-input::placeholder { color: #40506f; }

/* 语法高亮配色 */
.tk-keyword { color: var(--blue2); font-weight: 600; }
.tk-number { color: var(--orange); }
.tk-string { color: var(--green); }
.tk-comment { color: var(--text3); font-style: italic; }
.tk-func { color: var(--purple); }
.tk-ident { color: #e6edf7; }
.tk-op { color: #93a2bd; }

/* 补全下拉 */
.editor-complete {
  position: absolute; z-index: 60;
  background: #1b2436;
  border: 1px solid var(--border2);
  border-radius: 7px;
  box-shadow: 0 6px 20px rgba(0,0,0,.45);
  max-height: 230px; overflow-y: auto;
  min-width: 90px;
}
.cc-item { padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: var(--text); }
.cc-item.cc-on { background: var(--blue); color: #fff; }

/* 状态栏 */
.statusbar {
  display: flex; gap: 16px; align-items: center;
  padding: 4px 14px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  color: var(--text3); font-size: 11.5px;
  flex-shrink: 0;
}
.statusbar #状态提示 { flex: 1; text-align: right; color: var(--text3); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* ---------- 右侧 AI 面板 ---------- */
.ai-pane {
  width: 340px; flex-shrink: 0;
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-height: 0;
}
.ai-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.ai-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
.ai-title { font-weight: 700; font-size: 13.5px; }
.ai-gear { background: transparent; border-color: transparent; color: var(--text2); font-size: 15px; padding: 2px 6px; }
.ai-gear:hover { color: var(--text); }

.ai-tools {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 6px; padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.ai-tools button { padding: 5px 4px; font-size: 11.5px; }

.ai-msgs {
  flex: 1; overflow-y: auto;
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.ai-msg { max-width: 96%; }
.ai-user { align-self: flex-end; }
.ai-bot { align-self: flex-start; }
.ai-sys { align-self: center; }
.ai-msg-body {
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 12.5px; line-height: 1.65;
  word-break: break-word;
}
.ai-user .ai-msg-body { background: var(--blue); color: #fff; border-bottom-right-radius: 3px; }
.ai-bot .ai-msg-body { background: var(--panel3); border-bottom-left-radius: 3px; }
.ai-sys .ai-msg-body { background: transparent; color: var(--text3); font-size: 11.5px; }
.ai-code {
  background: #101828; border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px;
  font: 12px/1.6 Consolas, "Microsoft YaHei", monospace;
  color: #cfe3ff;
  overflow-x: auto;
  margin: 6px 0;
  white-space: pre-wrap;
}
.ai-err { color: var(--red); }

.ai-input {
  display: flex; gap: 6px; padding: 8px 10px;
  border-top: 1px solid var(--border);
}
.ai-input textarea {
  flex: 1; resize: none;
  background: var(--panel3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  color: var(--text);
  padding: 7px 9px;
  font-family: inherit; font-size: 12px; line-height: 1.5;
  outline: none;
  height: 44px;
}
.ai-input textarea:focus { border-color: var(--blue); }
.ai-send { align-self: stretch; }

.ai-setup {
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  background: var(--panel2);
  display: flex; flex-direction: column; gap: 5px;
}
.ai-setup-title { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }
.ai-setup label { font-size: 11px; color: var(--text2); margin-top: 5px; }
.ai-setup input {
  background: var(--panel3); border: 1px solid var(--border2);
  border-radius: 6px; color: var(--text);
  padding: 6px 8px; font-family: inherit; font-size: 12px;
  outline: none;
}
.ai-setup input:focus { border-color: var(--blue); }
.ai-setup-btns { display: flex; gap: 8px; margin-top: 8px; }
.ai-setup-btns button { flex: 1; }
.ai-setup-tip { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ---------- 底部输出区 ---------- */
.console-pane {
  height: 195px; flex-shrink: 0;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-height: 0;
}
.console-tabs {
  display: flex; align-items: center; gap: 2px;
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
}
.ctab {
  background: transparent; border: none; border-bottom: 2px solid transparent;
  border-radius: 0; color: var(--text2);
  padding: 7px 14px;
}
.ctab:hover { background: transparent; color: var(--text); }
.ctab.on { color: var(--blue2); border-bottom-color: var(--blue); }
.console-tabs #清屏按钮 { margin-left: auto; background: transparent; border-color: transparent; color: var(--text3); }
.console-tabs #清屏按钮:hover { color: var(--text); }

.console-body {
  flex: 1; overflow-y: auto;
  padding: 8px 14px;
  font: 12.5px/1.7 Consolas, "Microsoft YaHei", monospace;
}
.console-line { white-space: pre-wrap; word-break: break-word; }
.console-line .c-ok { color: var(--green); }
.console-line .c-err { color: var(--red); }
.console-line .c-dim { color: var(--text3); }
.console-line .c-mark { color: var(--yellow); }

.canvas-body { flex: 1; overflow: auto; display: flex; }
#画布容器 { margin: auto; padding: 12px; }
#画布容器 canvas {
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.35);
}
#画布容器 .canvas-tag { text-align: center; color: var(--text2); font-size: 12px; margin-top: 6px; }

/* ================= 输入弹窗 ================= */
.modal {
  position: fixed; inset: 0;
  background: rgba(5, 8, 16, .65);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.modal[hidden], [hidden] { display: none !important; }
.modal-box {
  width: 360px;
  background: var(--panel2);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}
.modal-tip { margin-bottom: 12px; color: var(--text2); font-size: 12.5px; }
.modal-box input {
  width: 100%;
  background: var(--panel3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text);
  padding: 10px 12px; font-size: 14px;
  outline: none;
}
.modal-box input:focus { border-color: var(--blue); }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

/* ================= 滚动条 ================= */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2b3854; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a4a6e; }

/* ================= 窄屏适配 ================= */
@media (max-width: 980px) {
  .ai-pane { width: 270px; }
  .sidebar { width: 150px; }
  .brand-sub { display: none; }
}
@media (max-width: 760px) {
  .ai-pane { display: none; }
  .sidebar { width: 130px; }
}
</style>
</head>
<body>

<!-- ================= 顶部工具栏 ================= -->
<header class="toolbar">
  <div class="brand">
    <span class="brand-logo">中</span>
    <span class="brand-name">中文程</span>
    <span class="brand-sub">个人中文编程软件 · 完全自主开发</span>
  </div>
  <div class="toolbar-actions">
    <button id="btn新建" title="新建文件">新建</button>
    <button id="btn保存" title="保存到本机 (Ctrl+S)">保存</button>
    <button id="btn导出" title="导出 .zy 文件">导出</button>
    <button id="btn导入" title="导入 .zy 文件">导入</button>
    <span class="sep"></span>
    <button id="btn运行" class="primary" title="运行程序 (Ctrl+R)">▶ 运行</button>
    <button id="btn停止" class="danger" disabled title="停止程序">■ 停止</button>
    <span class="sep"></span>
    <select id="方言选择" title="切换中文编程方言（语言）">
      <option value="zh">简体中文程</option>
      <option value="trad">繁体中文程</option>
      <option value="pinyin">拼音中文程</option>
    </select>
  </div>
</header>

<!-- ================= 主体 ================= -->
<main class="main">

  <!-- 左侧：文件栏 -->
  <aside class="sidebar">
    <div class="side-head">
      <span>我的程序</span>
      <button id="btn新建2" title="新建文件">＋</button>
    </div>
    <ul id="用户文件列表" class="file-list"></ul>
    <div class="side-head side-head2"><span>内置示例</span></div>
    <ul id="示例列表" class="file-list"></ul>
  </aside>

  <!-- 中间：编辑器 -->
  <section class="editor-pane">
    <div class="file-tab"><span id="当前文件名">未命名</span><span id="文件状态" class="file-status"></span></div>
    <div id="编辑器容器" class="editor-container"></div>
    <div class="statusbar">
      <span id="状态行列">行 1, 列 1</span>
      <span id="状态方言">简体中文程</span>
      <span id="状态提示"></span>
    </div>
  </section>

  <!-- 右侧：AI 助手 -->
  <aside class="ai-pane">
    <div id="AI面板" class="ai-panel"></div>
  </aside>

</main>

<!-- ================= 底部输出区 ================= -->
<footer class="console-pane">
  <div class="console-tabs">
    <button class="ctab on" data-tab="控制台">控制台</button>
    <button class="ctab" data-tab="画布">画布</button>
    <button id="清屏按钮" title="清空控制台">清空</button>
  </div>
  <div id="控制台区" class="console-body"></div>
  <div id="画布区" class="canvas-body" hidden>
    <div id="画布容器"></div>
  </div>
</footer>

<!-- ================= 输入弹窗（读入） ================= -->
<div id="输入弹窗" class="modal" hidden>
  <div class="modal-box">
    <div id="输入提示" class="modal-tip">请输入：</div>
    <input id="输入框" type="text">
    <div class="modal-btns"><button id="输入确定" class="primary">确定</button><button id="输入取消">取消</button></div>
  </div>
</div>

<script>/* ============================================================
 * 中文程 · 方言词表 (dialects.js)
 * ------------------------------------------------------------
 * 「中文程」语言族的内核只有一个（词法/语法/解释器共享同一套
 * token 体系），不同的中文方言只是把同一批 token 映射成不同
 * 的词。这样"各种各样的编程语言"都能用同一引擎解释运行，
 * 且每一种方言都是中文编程。
 *
 * token 类型说明：
 *   VAR      变量声明           WRITE    输出
 *   IF       如果              ELSE_IF  否则如果
 *   ELSE     否则              WHILE    当
 *   FOR      对于              FUNC     函数
 *   RETURN   返回              TRUE     真
 *   FALSE    假                NULL     空
 *   AND      且                OR       或
 *   NOT      非                CLASS    类
 *   NEW      新建              PROP     属性(类内字段)
 *   METHOD   方法(类内函数)    THIS     本(类内自身引用)
 *   FROM     从                TO       到
 *   IN       在                PLUS     加
 *   MINUS    减                STAR     乘
 *   SLASH    除                MOD      取余
 *   EQ       等于(比较)        NEQ      不等于
 *   GT       大于              LT       小于
 *   GE       大于等于          LE       小于等于
 *   ASGN     赋值(设/令)       READ     读入
 *   CLS      清屏              WAIT     等待
 * ============================================================ */

const DIALECTS = {
  /* ---------- 简体 · 白话文 ---------- */
  zh: {
    名称: "简体中文程",
    简介: "用简体白话书写的中文编程语言",
    词表: {
      "设": "VAR", "令": "VAR", "让": "VAR",
      "写": "WRITE", "打印": "WRITE", "输出": "WRITE",
      "如果": "IF", "否则如果": "ELSE_IF", "否则": "ELSE",
      "当": "WHILE", "循环": "WHILE",
      "对于": "FOR", "遍历": "FOR",
      "函数": "FUNC", "定义": "FUNC",
      "返回": "RETURN", "回": "RETURN",
      "真": "TRUE", "假": "FALSE", "空": "NULL", "无": "NULL",
      "且": "AND", "并且": "AND", "或": "OR", "或者": "OR",
      "非": "NOT", "不": "NOT",
      "类": "CLASS", "新建": "NEW", "实例化": "NEW",
      "属性": "PROP", "字段": "PROP",
      "方法": "METHOD", "行为": "METHOD",
      "本": "THIS",
      "从": "FROM", "到": "TO", "在": "IN", "中": "IN",
      "加": "PLUS", "减": "MINUS", "乘": "STAR", "除": "SLASH", "取余": "MOD", "模": "MOD",
      "等于": "EQ", "不等于": "NEQ", "大于": "GT", "小于": "LT",
      "大于等于": "GE", "不小于": "GE", "小于等于": "LE", "不大于": "LE",
      "赋值": "ASGN",
      "读入": "READ", "输入": "READ",
      "清屏": "CLS",
      "等待": "WAIT", "延时": "WAIT"
    },
    内建函数: {  // 标准库函数（中文名）
      "长度": "长度", "类型": "类型", "转文本": "转文本", "转数字": "转数字",
      "取整": "取整", "绝对值": "绝对值", "平方根": "平方根", "幂": "幂",
      "随机数": "随机数", "当前时间": "当前时间", "清空画布": "清空画布",
      "画布": "画布", "画点": "画点", "画线": "画线", "画圆": "画圆",
      "画矩形": "画矩形", "填充色": "填充色", "笔画色": "笔画色",
      "包含": "包含", "替换": "替换", "分割": "分割",
      "追加": "追加", "删除": "删除", "排序": "排序", "反转": "反转",
      "最大": "最大", "最小": "最小", "重复": "重复", "范围": "范围",
      "读文件": "读文件", "写文件": "写文件", "当前目录": "当前目录",
      "画弧": "画弧", "写字": "写字", "画多边形": "画多边形"
    }
  },

  /* ---------- 繁体 · 文言风 ---------- */
  trad: {
    名称: "繁体中文程",
    简介: "用繁体汉字书写的中文编程语言",

<script>/* ============================================================
 * 中文程 · 词法分析器 (lexer.js)
 * ------------------------------------------------------------
 * 把「中文程」源码拆成 token 流。本分析器不认识任何具体语言，
 * 只根据当前方言的词表把中文/拼音单词映射成统一的 token 类型，
 * 因此同一内核可以驱动简体、繁体、拼音等多种中文语言。
 *
 * token = { 类型, 值, 行, 列 }
 * 类型取值（统一体系）：
 *   NUMBER STRING IDENT | 方言词表映射出的关键词类型 |
 *   PLUS MINUS STAR SLASH MOD ASGN EQ NEQ GT LT GE LE AND OR NOT
 *   LPAREN RPAREN LBRACKET RBRACKET LBRACE RBRACE COMMA SEMI DOT COLON
 *   NL(换行标记) EOF(结束)
 * ============================================================ */

class 词法错误 extends Error {
  constructor(消息, 行, 列) {
    super(消息);
    this.行 = 行; this.列 = 列;
  }
}

class 词法分析器 {
  constructor(源码, 方言) {
    this.源码 = 源码;
    this.词表 = (方言 && 方言.词表) || DIALECTS.zh.词表;
    this.位置 = 0;
    this.行 = 1;
    this.列 = 1;
    // 最长词优先匹配（如"否则如果"要在"否则"之前匹配）
    this.词表排序 = Object.keys(this.词表).sort((a, b) => b.length - a.length);
  }

  当前字符() { return this.位置 < this.源码.length ? this.源码[this.位置] : ""; }
  下一个字符() { return this.位置 + 1 < this.源码.length ? this.源码[this.位置 + 1] : ""; }

  前进(n = 1) {
    for (let i = 0; i < n; i++) {
      if (this.位置 < this.源码.length) {
        if (this.源码[this.位置] === "\n") { this.行++; this.列 = 1; }
        else { this.列++; }
        this.位置++;
      }
    }
  }

  跳过空白() {
    while (this.位置 < this.源码.length) {
      const c = this.当前字符();
      if (c === " " || c === "\t" || c === "\r") { this.前进(); }
      else break;
    }
  }

  /* 若当前位置是注释开头则吃掉并返回 {文本,行,列}，否则返回 null */
  取注释() {
    const c = this.当前字符(), n = this.下一个字符();
    const 行 = this.行, 列 = this.列;
    let 文本 = "";
    if (c === "#" && n === "*") {          // 多行 #* ... *#
      this.前进(2); 文本 = "#*";
      while (this.位置 < this.源码.length && !(this.当前字符() === "*" && this.下一个字符() === "#")) { 文本 += this.当前字符(); this.前进(); }
      if (this.位置 < this.源码.length) { this.前进(2); 文本 += "*#"; }
      return { 文本, 行, 列 };
    }
    if (c === "/" && n === "*") {          // 多行 /* ... */
      this.前进(2); 文本 = "/*";
      while (this.位置 < this.源码.length && !(this.当前字符() === "*" && this.下一个字符() === "/")) { 文本 += this.当前字符(); this.前进(); }
      if (this.位置 < this.源码.length) { this.前进(2); 文本 += "*/"; }
      return { 文本, 行, 列 };
    }
    if (c === "#") {                       // 单行 #
      this.前进(); 文本 = "#";
      while (this.位置 < this.源码.length && this.当前字符() !== "\n") { 文本 += this.当前字符(); this.前进(); }
      return { 文本, 行, 列 };
    }
    if (c === "/" && n === "/") {          // 单行 //
      this.前进(2); 文本 = "//";
      while (this.位置 < this.源码.length && this.当前字符() !== "\n") { 文本 += this.当前字符(); this.前进(); }
      return { 文本, 行, 列 };
    }
    return null;
  }

  是标识符字符(c) {
    if (!c) return false;
    // 中文、字母、数字、下划线（首字符排除数字由调用处判断）
    return /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/.test(c) ||
           /[a-zA-Z0-9_]/.test(c);
  }

  是汉字(c) { return /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/.test(c); }

  分析(保留注释 = false) {
    const tokens = [];
    while (true) {
      this.跳过空白();
      // 吃掉并收集注释（若要求保留）
      while (true) {
        const 注释 = this.取注释();
        if (!注释) break;
        if (保留注释) tokens.push({ 类型: "COMMENT", 值: 注释.文本, 行: 注释.行, 列: 注释.列 });
      }
      if (this.位置 >= this.源码.length) break;

      const 行 = this.行, 列 = this.列;
      const c = this.当前字符(), n = this.下一个字符();

      /* 换行 → NL 标记（作为语句边界） */
      if (c === "\n") { tokens.push({ 类型: "NL", 值: "\n", 行, 列 }); this.前进(); continue; }

      /* 数字 */
      if (/[0-9]/.test(c)) {
        let 文本 = "";
        while (/[0-9]/.test(this.当前字符())) { 文本 += this.当前字符(); this.前进(); }
        if (this.当前字符() === "." && /[0-9]/.test(this.下一个字符())) {
          文本 += "."; this.前进();
          while (/[0-9]/.test(this.当前字符())) { 文本 += this.当前字符(); this.前进(); }
        }
        tokens.push({ 类型: "NUMBER", 值: parseFloat(文本), 行, 列 });
        continue;
      }

      /* 字符串：双引号 或 单引号 */
      if (c === '"' || c === "'") {
        const 引号 = c; this.前进();
        let 文本 = "";
        while (this.位置 < this.源码.length && this.当前字符() !== 引号) {
          if (this.当前字符() === "\\") {
            this.前进();
            const e = this.当前字符();
            if (e === "n") 文本 += "\n";
            else if (e === "t") 文本 += "\t";
            else if (e === "r") 文本 += "\r";
            else if (e === "\\") 文本 += "\\";
            else if (e === '"') 文本 += '"';
            else if (e === "'") 文本 += "'";
            else { 文本 += "\\" + e; }
            this.前进();
          } else {
            文本 += this.当前字符(); this.前进();
          }
        }
        if (this.位置 >= this.源码.length) throw new 词法错误("字符串未闭合：" + 文本.slice(0, 12) + "…", 行, 列);
        this.前进(); // 跳过闭合引号
        tokens.push({ 类型: "STRING", 值: 文本, 行, 列 });
        continue;
      }

      /* 符号运算符 */
      const 符号 = {
        "+": "PLUS", "-": "MINUS", "*": "STAR", "/": "SLASH", "%": "MOD",
        "==": "EQ", "!=": "NEQ", ">=": "GE", "<=": "LE", ">": "GT", "<": "LT",
        "&&": "AND", "||": "OR", "!": "NOT", "=": "ASGN",
        "(": "LPAREN", ")": "RPAREN", "[": "LBRACKET", "]": "RBRACKET",
        "{": "LBRACE", "}": "RBRACE", ",": "COMMA", ";": "SEMI", ".": "DOT", ":": "COLON"
      };
      const 两字符 = c + n;
      if (符号[两字符]) { tokens.push({ 类型: 符号[两字符], 值: 两字符, 行, 列 }); this.前进(2); continue; }
      if (符号[c]) { tokens.push({ 类型: 符号[c], 值: c, 行, 列 }); this.前进(); continue; }

      /* 标识符 / 关键词：
       * 先扫描出最大连续的标识符串（汉字/字母/数字/下划线），
       * 再用整串去匹配词表——只有整串都是关键词时才作为关键词，
       * 避免「中间」「jiafa」这类包含关键词字符的普通名称被误拆。 */
      if (this.是汉字(c) || /[a-zA-Z_]/.test(c)) {
        let 文本 = "";
        while (this.是标识符字符(this.当前字符())) { 文本 += this.当前字符(); this.前进(); }
        if (this.词表[文本]) {
          tokens.push({ 类型: this.词表[文本], 值: 文本, 行, 列 });
        } else {
          tokens.push({ 类型: "IDENT", 值: 文本, 行, 列 });
        }
        continue;
      }

      throw new 词法错误("无法识别的字符：" + JSON.stringify(c), 行, 列);
    }
    tokens.push({ 类型: "EOF", 值: null, 行: this.行, 列: this.列 });
    return tokens;
  }
}
</script>
<script>/* ============================================================
 * 中文程 · 语法分析器 (parser.js)
 * ------------------------------------------------------------
 * 递归下降分析器：把 token 流构造成 AST（抽象语法树）。
 * 同样不认识具体语言——只依据统一的 token 类型，因此三种
 * 方言共享同一语法结构，写出的都是"中文编程"。
 *
 * AST 节点统一用 { 类型: "…", … } 表示，类型有：
 *   程序 赋值 输出 如果 当 对于 函数 返回 类 属性 方法 新建
 *   字面量 变量 二元 一元 调用 成员 下标 列表 字典 读入 清屏 等待
 * ============================================================ */

class 语法错误 extends Error {
  constructor(消息, 行, 列) {
    super(消息);
    this.行 = 行; this.列 = 列;
  }
}

class 语法分析器 {
  constructor(tokens) {
    this.tokens = tokens;
    this.位置 = 0;
  }

  当前() { return this.tokens[this.位置]; }
  下一个(k = 1) { return this.tokens[this.位置 + k]; }
  前进() { this.位置++; }

  检查(类型) { return this.当前().类型 === 类型; }

  匹配(类型) {
    if (this.检查(类型)) { const t = this.当前(); this.前进(); return t; }
    return null;
  }

  期望(类型, 说明) {
    const t = this.匹配(类型);
    if (!t) {
      const 现 = this.当前();
      throw new 语法错误(`此处应为「${说明}」但遇到了「${现.值 !== undefined && 现.值 !== null ? 现.值 : 现.类型}」（第 ${现.行} 行）`, 现.行, 现.列);
    }
    return t;
  }

  跳过NL() {
    while (this.检查("NL") || this.检查("SEMI")) this.前进();
  }

  /* ---------- 程序 ---------- */
  分析程序() {
    const 语句 = [];
    while (!this.检查("EOF")) {
      this.跳过NL();
      if (this.检查("EOF")) break;
      语句.push(this.分析语句());
      this.跳过NL();
    }
    return { 类型: "程序", 语句 };
  }

  /* ---------- 语句 ---------- */
  分析语句() {
    const t = this.当前();
    switch (t.类型) {
      case "VAR":   return this.分析变量声明();
      case "IF":    return this.分析如果();
      case "WHILE": return this.分析当();
      case "FOR":   return this.分析对于();
      case "FUNC":  return this.分析函数();
      case "RETURN":return this.分析返回();
      case "CLASS": return this.分析类();
      case "WRITE": return this.分析内置调用("输出");
      case "READ":  return this.分析内置调用("读入");
      case "CLS":   return this.分析内置调用("清屏");
      case "WAIT":  return this.分析内置调用("等待");
      case "NL":
      case "SEMI":  this.跳过NL(); return this.分析语句();
      default:      return this.分析表达式语句();
    }
  }

  /* 设 x = 表达式  /  设 x  */
  分析变量声明() {
    const t0 = this.当前();
    this.匹配("VAR");
    const 名字 = this.期望("IDENT", "变量名").值;
    let 值 = null;
    if (this.匹配("ASGN")) 值 = this.分析表达式();
    return { 类型: "赋值", 名字, 值, 声明: true, 行: t0.行, 列: t0.列 };
  }

  /* x = 表达式  /  本.属性 = 值  /  列表[下标] = 值 */
  分析表达式语句() {
    const t0 = this.当前();
    const 表达式 = this.分析表达式();
    if (this.匹配("ASGN")) {
      const 可赋值 = 表达式 && (表达式.类型 === "变量" || 表达式.类型 === "成员" || 表达式.类型 === "下标");
      if (!可赋值) {
        const t = this.当前();
        throw new 语法错误(`等号左边必须是变量、属性或列表元素（第 ${t.行} 行）`, t.行, t.列);
      }
      const 值 = this.分析表达式();
      return { 类型: "赋值目标", 目标: 表达式, 值, 行: t0.行, 列: t0.列 };
    }
    if (表达式 === null) {
      const t = this.当前();
      throw new 语法错误(`无法理解的语句（第 ${t.行} 行）`, t.行, t.列);
    }
    return { 类型: "表达式语句", 表达式, 行: t0.行, 列: t0.列 };
  }

  /* 如果 (条件) { 体 } 否则如果 (条件) { 体 } … 否则 { 体 } */
  分析如果() {
    const t0 = this.当前();
    this.匹配("IF");
    const 分支 = [];
    const 条件 = this.分析条件表达式();
    分支.push({ 条件, 体: this.分析块() });
    this.跳过NL();   // 块结束后的换行也要跳过，否则链式分支断开
    while (this.检查("ELSE_IF")) {
      this.匹配("ELSE_IF");
      const 条件2 = this.分析条件表达式();
      分支.push({ 条件: 条件2, 体: this.分析块() });
      this.跳过NL();
    }
    let 否则体 = null;
    if (this.匹配("ELSE")) 否则体 = this.分析块();
    return { 类型: "如果", 分支, 否则体, 行: t0.行, 列: t0.列 };
  }

  分析条件表达式() {
    this.跳过NL();
    const 有括号 = !!this.匹配("LPAREN");
    if (有括号) this.跳过NL();
    const 表达式 = this.分析表达式();
    if (有括号) {
      this.跳过NL();
      this.期望("RPAREN", "右括号）");
    }
    return 表达式;
  }

  /* 当 (条件) { 体 } */
  分析当() {
    const t0 = this.当前();
    this.匹配("WHILE");
    const 条件 = this.分析条件表达式();
    return { 类型: "当", 条件, 体: this.分析块(), 行: t0.行, 列: t0.列 };
  }

  /* 对于 i 在 列表 { 体 }   或   对于 i 从 1 到 10 { 体 } */
  分析对于() {
    const t0 = this.当前();
    this.匹配("FOR");
    this.跳过NL();
    const 变量 = this.期望("IDENT", "循环变量名").值;
    this.跳过NL();
    if (this.匹配("IN")) {
      const 源 = this.分析表达式();
      return { 类型: "对于", 变量, 源, 体: this.分析块(), 行: t0.行, 列: t0.列 };
    }
    if (this.匹配("FROM")) {
      const 起点 = this.分析表达式();
      this.期望("TO", "「到」");
      const 终点 = this.分析表达式();
      return { 类型: "对于", 变量, 起点, 终点, 体: this.分析块(), 行: t0.行, 列: t0.列 };
    }
    const t = this.当前();
    throw new 语法错误(`「对于」后需要「在」或「从…到」（第 ${t.行} 行）`, t.行, t.列);
  }

  /* 函数 名字(参数…) { 体 } */
  分析函数() {
    const t0 = this.当前();
    this.匹配("FUNC");
    const 名字 = this.期望("IDENT", "函数名").值;
    this.跳过NL();
    this.期望("LPAREN", "（");
    this.跳过NL();
    const 参数 = [];
    while (!this.检查("RPAREN")) {
      if (this.检查("EOF")) throw new 语法错误("函数参数列表未闭合", this.当前().行, this.当前().列);
      参数.push(this.期望("IDENT", "参数名").值);
      if (!this.匹配("COMMA")) break;
      this.跳过NL();
    }
    this.期望("RPAREN", "）");
    this.跳过NL();
    const 体 = this.分析块();
    return { 类型: "函数", 名字, 参数, 体, 行: t0.行, 列: t0.列 };
  }

  /* 返回 表达式  /  返回 */
  分析返回() {
    const t0 = this.当前();
    this.匹配("RETURN");
    this.跳过NL();
    let 值 = null;
    if (!this.检查("NL") && !this.检查("EOF") && !this.检查("RBRACE") && !this.检查("SEMI")) {
      值 = this.分析表达式();
    }
    return { 类型: "返回", 值, 行: t0.行, 列: t0.列 };
  }

  /* 类 名字 { 属性 x = …; 方法 f(…) { … } } */
  分析类() {
    const t0 = this.当前();
    this.匹配("CLASS");
    const 名字 = this.期望("IDENT", "类名").值;
    this.跳过NL();
    this.期望("LBRACE", "｛");
    this.跳过NL();
    const 成员 = [];
    while (true) {
      if (this.检查("EOF")) throw new 语法错误("类定义未闭合", this.当前().行, this.当前().列);
      this.跳过NL();
      if (this.检查("RBRACE")) break;   // 成员结束后的换行要先跳过再判断类结束
      if (this.检查("PROP")) {
        this.匹配("PROP");
        const 属性名 = this.期望("IDENT", "属性名").值;
        let 属性值 = null;
        if (this.匹配("ASGN")) 属性值 = this.分析表达式();
        成员.push({ 类型: "属性", 名字: 属性名, 值: 属性值 });
        this.跳过NL();
        continue;
      }
      if (this.检查("METHOD") || this.检查("FUNC")) {
        this.前进();
        const 方法名 = this.期望("IDENT", "方法名").值;
        this.跳过NL();
        this.期望("LPAREN", "（");
        this.跳过NL();
        const 参数 = [];
        while (!this.检查("RPAREN")) {
          参数.push(this.期望("IDENT", "参数名").值);
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RPAREN", "）");
        this.跳过NL();
        const 体 = this.分析块();
        成员.push({ 类型: "方法", 名字: 方法名, 参数, 体 });
        continue;
      }
      const t = this.当前();
      throw new 语法错误(`类成员需要以「属性」或「方法」开头（第 ${t.行} 行）`, t.行, t.列);
    }
    this.期望("RBRACE", "｝");
    return { 类型: "类", 名字, 成员, 行: t0.行, 列: t0.列 };
  }

  /* 块 { 语句… } */
  分析块() {
    this.跳过NL();
    this.期望("LBRACE", "｛");
    this.跳过NL();
    const 语句 = [];
    while (!this.检查("RBRACE")) {
      if (this.检查("EOF")) throw new 语法错误("语句块未闭合，缺少｝", this.当前().行, this.当前().列);
      语句.push(this.分析语句());
      this.跳过NL();
    }
    this.期望("RBRACE", "｝");
    return { 类型: "块", 语句 };
  }

  /* 写(…) 读入(…) 清屏() 等待(…) —— 语句级内置调用 */
  分析内置调用(节点类型) {
    const t0 = this.当前();
    this.前进(); // 吃掉关键词 token
    this.跳过NL();
    this.期望("LPAREN", "（");
    this.跳过NL();
    const 参数 = [];
    while (!this.检查("RPAREN")) {
      if (this.检查("EOF")) throw new 语法错误("调用参数列表未闭合", this.当前().行, this.当前().列);
      参数.push(this.分析表达式());
      if (!this.匹配("COMMA")) break;
      this.跳过NL();
    }
    this.期望("RPAREN", "）");
    return { 类型: 节点类型, 参数, 行: t0.行, 列: t0.列 };
  }

  /* ---------- 表达式 ---------- */

  /* 或 */
  分析表达式() {
    this.跳过NL();
    let 左 = this.分析且();
    while (this.检查("OR")) {
      this.前进(); this.跳过NL();
      const 右 = this.分析且();
      左 = { 类型: "二元", 运算: "或", 左, 右 };
    }
    return 左;
  }

  分析且() {
    let 左 = this.分析比较();
    while (this.检查("AND")) {
      this.前进(); this.跳过NL();
      const 右 = this.分析比较();
      左 = { 类型: "二元", 运算: "且", 左, 右 };
    }
    return 左;
  }

  分析比较() {
    let 左 = this.分析加减();
    while (true) {
      const t = this.当前().类型;
      const 映射 = { "EQ": "等于", "NEQ": "不等于", "GT": "大于", "LT": "小于", "GE": "大于等于", "LE": "小于等于" };
      if (映射[t]) {
        this.前进(); this.跳过NL();
        const 右 = this.分析加减();
        左 = { 类型: "二元", 运算: 映射[t], 左, 右 };
      } else break;
    }
    return 左;
  }

  分析加减() {
    let 左 = this.分析乘除();
    while (true) {
      const t = this.当前().类型;
      if (t === "PLUS" || t === "MINUS") {
        this.前进(); this.跳过NL();
        const 右 = this.分析乘除();
        左 = { 类型: "二元", 运算: t === "PLUS" ? "加" : "减", 左, 右 };
      } else break;
    }
    return 左;
  }

  分析乘除() {
    let 左 = this.分析一元();
    while (true) {
      const t = this.当前().类型;
      if (t === "STAR" || t === "SLASH" || t === "MOD") {
        this.前进(); this.跳过NL();
        const 右 = this.分析一元();
        左 = { 类型: "二元", 运算: t === "STAR" ? "乘" : t === "SLASH" ? "除" : "取余", 左, 右 };
      } else break;
    }
    return 左;
  }

  分析一元() {
    const t = this.当前().类型;
    if (t === "NOT" || t === "MINUS") {
      this.前进(); this.跳过NL();
      const 操作数 = this.分析一元();
      return { 类型: "一元", 运算: t === "NOT" ? "非" : "负", 操作数 };
    }
    return this.分析后缀();
  }

  分析后缀() {
    let 表达式 = this.分析原子();
    while (true) {
      this.跳过NL();
      const t = this.当前().类型;
      if (t === "DOT") {
        this.前进();
        const 名字 = this.期望("IDENT", "成员名").值;
        表达式 = { 类型: "成员", 对象: 表达式, 名字 };
      } else if (t === "LBRACKET") {
        this.前进(); this.跳过NL();
        const 索引 = this.分析表达式();
        this.期望("RBRACKET", "】");
        表达式 = { 类型: "下标", 对象: 表达式, 索引 };
      } else if (t === "LPAREN") {
        this.前进(); this.跳过NL();
        const 参数 = [];
        while (!this.检查("RPAREN")) {
          if (this.检查("EOF")) throw new 语法错误("调用参数未闭合", this.当前().行, this.当前().列);
          参数.push(this.分析表达式());
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RPAREN", "）");
        表达式 = { 类型: "调用", 目标: 表达式, 参数 };
      } else break;
    }
    return 表达式;
  }

  分析原子() {
    this.跳过NL();
    const t = this.当前();
    switch (t.类型) {
      case "NUMBER": this.前进(); return { 类型: "字面量", 值: t.值 };
      case "STRING": this.前进(); return { 类型: "字面量", 值: t.值 };
      case "TRUE":  this.前进(); return { 类型: "字面量", 值: true };
      case "FALSE": this.前进(); return { 类型: "字面量", 值: false };
      case "NULL":  this.前进(); return { 类型: "字面量", 值: null };
      case "THIS":  this.前进(); return { 类型: "本" };
      case "IDENT": {
        this.前进();
        return { 类型: "变量", 名字: t.值 };
      }
      case "LPAREN": {
        this.前进(); this.跳过NL();
        const 表达式 = this.分析表达式();
        this.跳过NL();
        this.期望("RPAREN", "）");
        return 表达式;
      }
      case "LBRACKET": {
        this.前进(); this.跳过NL();
        const 元素 = [];
        while (!this.检查("RBRACKET")) {
          if (this.检查("EOF")) throw new 语法错误("列表未闭合", this.当前().行, this.当前().列);
          元素.push(this.分析表达式());
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RBRACKET", "】");
        return { 类型: "列表", 元素 };
      }
      case "LBRACE": {
        this.前进(); this.跳过NL();
        const 键值 = [];
        while (!this.检查("RBRACE")) {
          if (this.检查("EOF")) throw new 语法错误("字典未闭合", this.当前().行, this.当前().列);
          let 键;
          if (this.检查("STRING")) 键 = this.匹配("STRING").值;
          else if (this.检查("IDENT")) 键 = this.匹配("IDENT").值;
          else {
            const tt = this.当前();
            throw new 语法错误(`字典键应为文本或名称（第 ${tt.行} 行）`, tt.行, tt.列);
          }
          this.跳过NL();
          this.期望("COLON", "：");
          this.跳过NL();
          const 值 = this.分析表达式();
          键值.push({ 键, 值 });
          this.跳过NL();
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RBRACE", "｝");
        return { 类型: "字典", 键值 };
      }
      case "NEW": {
        this.前进();
        const 类名 = this.期望("IDENT", "类名").值;
        this.跳过NL();
        this.期望("LPAREN", "（");
        this.跳过NL();
        const 参数 = [];
        while (!this.检查("RPAREN")) {
          参数.push(this.分析表达式());
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RPAREN", "）");
        return { 类型: "新建", 类名, 参数 };
      }
      case "READ":
      case "CLS":
      case "WAIT":
      case "WRITE": {
        // 内置调用也可作为表达式（如：设 猜测 = 读入("…")）
        const 类型 = t.类型 === "READ" ? "读入" : t.类型 === "CLS" ? "清屏" : t.类型 === "WAIT" ? "等待" : "输出";
        this.前进(); this.跳过NL();
        this.期望("LPAREN", "（");
        this.跳过NL();
        const 参数 = [];
        while (!this.检查("RPAREN")) {
          if (this.检查("EOF")) throw new 语法错误("调用参数未闭合", this.当前().行, this.当前().列);
          参数.push(this.分析表达式());
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RPAREN", "）");
        return { 类型, 参数, 行: t.行, 列: t.列 };
      }
      case "FUNC": {
        // 函数表达式（可作值传递）：函数 (参数) { 体 } 或 函数 名字(参数) { 体 }
        const 起始 = this.当前();
        this.前进();
        let 函数名 = null;
        if (this.检查("IDENT")) 函数名 = this.匹配("IDENT").值;
        this.跳过NL();
        this.期望("LPAREN", "（");
        this.跳过NL();
        const 参数 = [];
        while (!this.检查("RPAREN")) {
          参数.push(this.期望("IDENT", "参数名").值);
          if (!this.匹配("COMMA")) break;
          this.跳过NL();
        }
        this.期望("RPAREN", "）");
        this.跳过NL();
        const 体 = this.分析块();
        return { 类型: "函数表达式", 名字: 函数名, 参数, 体, 行: 起始.行, 列: 起始.列 };
      }
      default: {
        return null;
      }
    }
  }
}

function 解析源码(源码, 方言) {
  const 词法 = new 词法分析器(源码, 方言);
  const tokens = 词法.分析();
  const 语法 = new 语法分析器(tokens);
  return 语法.分析程序();
}

<script>/* ============================================================
 * 中文程 · 解释器 (interpreter.js)
 * ------------------------------------------------------------
 * 自研的树遍历（tree-walking）解释器：直接沿着 AST 求值。
 * 采用异步执行模型，保证"等待""读入"等操作不冻结界面，
 * 同时循环过程中随时可响应"停止"命令。
 *
 * 值模型：
 *   数字 number / 文本 string / 逻辑 boolean / 空 null
 *   列表 { __类型:"列表", 数据:[…] }
 *   字典 { __类型:"字典", 数据:{…} }
 *   函数 { __类型:"函数", 名字, 参数, 体, 环境 }   （闭包）
 *   类   { __类型:"类", 名字, 属性, 方法 }
 *   实例 { __类型:"实例", 类, 字段 }
 * ============================================================ */

class 运行时错误 extends Error {
  constructor(消息, 行, 列) {
    super(消息);
    this.行 = 行 || 0; this.列 = 列 || 0;
  }
}

/* ---------- 环境（作用域链） ---------- */
class 作用域 {
  constructor(父) { this.变量 = new Map(); this.父 = 父 || null; }

  定义(名字, 值) { this.变量.set(名字, 值); }

  查找(名字) {
    let 环 = this;
    while (环) {
      if (环.变量.has(名字)) return 环;
      环 = 环.父;
    }
    return null;
  }

  取(名字) {
    const 环 = this.查找(名字);
    if (!环) throw new 运行时错误(`未定义的名称：「${名字}」。需要先「设」一下，或者检查拼写。`);
    return 环.变量.get(名字);
  }

  赋值(名字, 值) {
    const 环 = this.查找(名字);
    if (环) { 环.变量.set(名字, 值); return; }
    // 未声明时自动定义（宽容模式，方便初学者）
    this.变量.set(名字, 值);
  }
}

/* ---------- 解释器 ---------- */
class 解释器 {
  constructor(运行时) {
    this.运行时 = 运行时;      // 提供 输出/读入/清屏/等待/画布/文件 等宿主能力
    this.停止 = false;         // 停止标志
    this.当前行 = 0; this.当前列 = 0;
    this.全局 = new 作用域();
    this.注册内置函数();
  }

  /* 记录语句位置，用于错误定位 */
  定位(节点) {
    if (节点 && 节点.行) { this.当前行 = 节点.行; this.当前列 = 节点.列; }
  }

  报错(消息, 节点) {
    if (节点 && 节点.行) throw new 运行时错误(消息, 节点.行, 节点.列);
    throw new 运行时错误(消息, this.当前行, this.当前列);
  }

  检查停止() {
    if (this.停止 || (this.运行时 && this.运行时.停止)) throw new 运行时错误("程序已被手动停止", this.当前行, this.当前列);
  }

  让出() { return Promise.resolve(); }

  /* ---------- 入口 ---------- */
  async 运行(程序) {
    this.停止 = false;
    for (const 语句 of 程序.语句) {
      this.检查停止();
      await this.执行(语句, this.全局);
      await this.让出();
    }
  }

  /* ---------- 语句执行（异步） ---------- */
  async 执行(节点, 环境) {
    if (!节点) return null;
    this.定位(节点);
    switch (节点.类型) {
      case "块": {
        const 子环境 = new 作用域(环境);
        for (const 语句 of 节点.语句) {
          this.检查停止();
          await this.执行(语句, 子环境);
          await this.让出();
        }
        return null;
      }
      case "赋值": {
        let 值 = null;
        if (节点.值) 值 = await this.求值(节点.值, 环境);
        if (节点.声明) 环境.定义(节点.名字, 值);
        else 环境.赋值(节点.名字, 值);
        return null;
      }
      case "赋值目标": {
        const 值 = await this.求值(节点.值, 环境);
        await this.赋值到(节点.目标, 值, 环境, 节点);
        return null;
      }
      case "表达式语句": {
        await this.求值(节点.表达式, 环境);
        return null;
      }
      case "输出": {
        const 片段 = [];
        for (const 参数 of 节点.参数) {
          const 值 = await this.求值(参数, 环境);
          片段.push(格式化值(值));
        }
        this.运行时.输出(片段.join(" "));
        return null;
      }
      case "读入": {
        let 提示 = "";
        if (节点.参数 && 节点.参数.length > 0) {
          const 值 = await this.求值(节点.参数[0], 环境);
          提示 = 格式化值(值);
        }
        const 结果 = await this.运行时.读入(提示);
        return 结果;
      }
      case "清屏": {
        this.运行时.清屏();
        return null;
      }
      case "等待": {
        let 毫秒 = 1000;
        if (节点.参数 && 节点.参数.length > 0) {
          const 值 = await this.求值(节点.参数[0], 环境);
          毫秒 = 转数字(值) || 1000;
        }
        await this.运行时.等待(毫秒);
        return null;
      }
      case "如果": {
        for (const 分支 of 节点.分支) {
          const 条件 = await this.求值(分支.条件, 环境);
          if (真值(条件)) { await this.执行(分支.体, 环境); return null; }
        }
        if (节点.否则体) await this.执行(节点.否则体, 环境);
        return null;
      }
      case "当": {
        while (真值(await this.求值(节点.条件, 环境))) {
          this.检查停止();
          await this.执行(节点.体, 环境);
          await this.让出();
        }
        return null;
      }
      case "对于": {
        const 子环境 = new 作用域(环境);
        if (节点.源) {
          const 源 = await this.求值(节点.源, 环境);
          const 迭代 = 可迭代(源, this);
          for (const 元素 of 迭代) {
            this.检查停止();
            子环境.定义(节点.变量, 元素);
            await this.执行(节点.体, 子环境);
            await this.让出();
          }
        } else {
          const 起点 = await this.求值(节点.起点, 环境);
          const 终点 = await this.求值(节点.终点, 环境);
          const 开始 = Math.floor(转数字(起点) || 0);
          const 结束 = Math.floor(转数字(终点) || 0);
          const 步长 = 开始 <= 结束 ? 1 : -1;
          for (let i = 开始; 步长 > 0 ? i <= 结束 : i >= 结束; i += 步长) {
            this.检查停止();
            子环境.定义(节点.变量, i);
            await this.执行(节点.体, 子环境);
            await this.让出();
          }
        }
        return null;
      }
      case "函数": {
        const 函数值 = { __类型: "函数", 名字: 节点.名字, 参数: 节点.参数, 体: 节点.体, 环境 };
        环境.定义(节点.名字, 函数值);
        return null;
      }
      case "函数表达式": {
        return { __类型: "函数", 名字: 节点.名字 || "匿名", 参数: 节点.参数, 体: 节点.体, 环境 };
      }
      case "返回": {
        let 值 = null;
        if (节点.值) 值 = await this.求值(节点.值, 环境);
        throw { __返回: 值 };
      }
      case "类": {
        const 属性 = new Map();
        const 方法 = new Map();
        for (const 成员 of 节点.成员) {
          if (成员.类型 === "属性") 属性.set(成员.名字, 成员);
          else if (成员.类型 === "方法") 方法.set(成员.名字, 成员);
        }
        环境.定义(节点.名字, { __类型: "类", 名字: 节点.名字, 属性, 方法, 环境 });
        return null;
      }
      default:
        this.报错(`未知语句类型：${节点.类型}`, 节点);
        return null;
    }
  }

  /* ---------- 表达式求值（同步） ---------- */
  async 求值(节点, 环境) {
    if (节点 === null || 节点 === undefined) return null;
    switch (节点.类型) {
      case "字面量": return 节点.值;
      case "函数表达式": {
        return { __类型: "函数", 名字: 节点.名字 || "匿名", 参数: 节点.参数, 体: 节点.体, 环境 };
      }
      case "本": {
        const 环 = 环境.查找("本");
        if (!环 || !环.变量.has("本")) this.报错("「本」只能在类的方法内使用", 节点);
        return 环.变量.get("本");
      }
      case "变量": {
        return 环境.取(节点.名字);
      }
      case "列表": {
        const 数据 = [];
        for (const 元素 of 节点.元素) 数据.push(await this.求值(元素, 环境));
        return { __类型: "列表", 数据 };
      }
      case "字典": {
        const 数据 = {};
        for (const 对 of 节点.键值) {
          const 键 = typeof 对.键 === "string" ? 对.键 : 格式化值(对.键);
          数据[键] = await this.求值(对.值, 环境);
        }
        return { __类型: "字典", 数据 };
      }
      case "新建": {
        const 类值 = 环境.取(节点.类名);
        if (!类值 || 类值.__类型 !== "类") this.报错(`「${节点.类名}」不是类，无法新建`, 节点);
        const 实例 = { __类型: "实例", 类: 类值, 字段: new Map() };
        // 初始化属性默认值
        for (const [名, 属性节点] of 类值.属性) {
          let 值 = null;
          if (属性节点.值) 值 = await this.求值(属性节点.值, 类值.环境);
          实例.字段.set(名, 值);
        }
        // 调用构造方法（方法名约定为「构造」）
        const 构造 = 类值.方法.get("构造");
        if (构造) {
          const 函数值 = { __类型: "函数", 名字: "构造", 参数: 构造.参数, 体: 构造.体, 环境: 类值.环境 };
          await this.调用函数(函数值, 节点.参数, 环境, 实例);
        }
        return 实例;
      }
      case "成员": {
        const 对象 = await this.求值(节点.对象, 环境);
        return 取成员(对象, 节点.名字, this, 节点);
      }
      case "下标": {
        const 对象 = await this.求值(节点.对象, 环境);
        const 索引 = await this.求值(节点.索引, 环境);
        if (对象.__类型 === "列表") {
          const i = Math.floor(转数字(索引));
          if (i < 0 || i >= 对象.数据.length) this.报错(`列表索引 ${i} 超出范围（长度 ${对象.数据.length}）`, 节点);
          return 对象.数据[i];
        }
        if (对象.__类型 === "字典") {
          const 键 = typeof 索引 === "string" ? 索引 : 格式化值(索引);
          if (!(键 in 对象.数据)) this.报错(`字典中没有键「${键}」`, 节点);
          return 对象.数据[键];
        }
        if (typeof 对象 === "string") {
          const i = Math.floor(转数字(索引));
          if (i < 0 || i >= 对象.length) this.报错(`文本索引 ${i} 超出范围`, 节点);
          return 对象[i];
        }
        this.报错("该值不能按下标访问", 节点);
        return null;
      }
      case "一元": {
        const 操作数 = await this.求值(节点.操作数, 环境);
        if (节点.运算 === "非") return !真值(操作数);
        if (节点.运算 === "负") return -(转数字(操作数));
        this.报错(`未知一元运算：${节点.运算}`, 节点);
        return null;
      }
      case "二元": {
        const 左 = await this.求值(节点.左, 环境);
        if (节点.运算 === "且") { if (!真值(左)) return false; return 真值(await this.求值(节点.右, 环境)); }
        if (节点.运算 === "或") { if (真值(左)) return true; return 真值(await this.求值(节点.右, 环境)); }
        const 右 = await this.求值(节点.右, 环境);
        switch (节点.运算) {
          case "加": return 相加(左, 右, this, 节点);
          case "减": return 转数字(左) - 转数字(右);
          case "乘": return 转数字(左) * 转数字(右);
          case "除":
            if (转数字(右) === 0) this.报错("除数不能为零", 节点);
            return 转数字(左) / 转数字(右);
          case "取余": {
            // 与 Python 内核一致：商向负无穷取整的余数（-7 取余 3 = 2）
            if (转数字(右) === 0) this.报错("取余时除数不能为零", 节点);
            const 被除数 = 转数字(左), 除数 = 转数字(右);
            return ((被除数 % 除数) + 除数) % 除数;
          }
          case "等于": return 相等(左, 右);
          case "不等于": return !相等(左, 右);
          case "大于": return 转数字(左) > 转数字(右);
          case "小于": return 转数字(左) < 转数字(右);
          case "大于等于": return 转数字(左) >= 转数字(右);
          case "小于等于": return 转数字(左) <= 转数字(右);
          default: this.报错(`未知运算：${节点.运算}`, 节点);
        }
        return null;
      }
      case "调用": {
        const 目标 = await this.求值(节点.目标, 环境);
        return this.调用(目标, 节点.参数, 环境, 节点);
      }
      case "读入": {
        let 提示 = "";
        if (节点.参数 && 节点.参数.length > 0) {
          提示 = 格式化值(await this.求值(节点.参数[0], 环境));
        }
        return await this.运行时.读入(提示);
      }
      case "清屏": {
        this.运行时.清屏();
        return null;
      }
      case "等待": {
        let 毫秒 = 1000;
        if (节点.参数 && 节点.参数.length > 0) {
          毫秒 = 转数字(await this.求值(节点.参数[0], 环境)) || 1000;
        }
        await this.运行时.等待(毫秒);
        return null;
      }
      case "输出": {
        const 片段 = [];
        for (const 参数 of 节点.参数) 片段.push(格式化值(await this.求值(参数, 环境)));
        this.运行时.输出(片段.join(" "));
        return null;
      }
      default:
        this.报错(`未知表达式类型：${节点.类型}`, 节点);
        return null;
    }
  }

  /* 调用：函数值 / 成员方法 / 内置函数 */
  async 调用(目标, 参数节点, 环境, 节点) {
    // 内置函数（JS 函数）
    if (typeof 目标 === "function") {
      const 参数 = [];
      for (const p of 参数节点) 参数.push(await this.求值(p, 环境));
      return 目标(参数, this);
    }
    // 中文程函数
    if (目标 && 目标.__类型 === "函数") {
      return this.调用函数(目标, 参数节点, 环境, null);
    }
    // 实例方法（绑定本）
    if (目标 && 目标.__类型 === "实例方法") {
      return this.调用函数(目标.函数, 参数节点, 环境, 目标.实例);
    }
    if (目标 && 目标.__类型 === "实例") {
      // 实例被直接调用：若实例是函数对象包装？不支持
      this.报错("实例不能直接调用，请调用它的方法", 节点);
    }
    this.报错("这里不是一个可以调用的函数", 节点);
    return null;
  }

  async 调用函数(函数值, 参数节点, 环境, 本) {
    const 参数 = [];
    for (const p of 参数节点) 参数.push(await this.求值(p, 环境));
    if (参数.length !== 函数值.参数.length) {
      this.报错(`函数「${函数值.名字 || "匿名"}」需要 ${函数值.参数.length} 个参数，实际给了 ${参数.length} 个`);
    }
    const 调用环境 = new 作用域(函数值.环境);
    if (本 !== null && 本 !== undefined) 调用环境.定义("本", 本);
    for (let i = 0; i < 函数值.参数.length; i++) 调用环境.定义(函数值.参数[i], 参数[i]);
    try {
      await this.执行(函数值.体, 调用环境);
    } catch (e) {
      if (e && e.__返回 !== undefined) return e.__返回;
      throw e;
    }
    return null;
  }

  /* 赋值到：变量 / 成员属性 / 下标元素 */
  async 赋值到(目标, 值, 环境, 节点) {
    if (目标.类型 === "变量") { 环境.赋值(目标.名字, 值); return; }
    const 对象 = await this.求值(目标.对象, 环境);
    if (目标.类型 === "成员") {
      if (对象.__类型 === "实例") { 对象.字段.set(目标.名字, 值); return; }
      if (对象.__类型 === "字典") { 对象.数据[目标.名字] = 值; return; }
      this.报错("该值不能设置成员", 节点);
    }
    if (目标.类型 === "下标") {
      const 索引 = await this.求值(目标.索引, 环境);
      if (对象.__类型 === "列表") {
        对象.数据[Math.floor(转数字(索引))] = 值;
        return;
      }
      if (对象.__类型 === "字典") { 对象.数据[格式化值(索引)] = 值; return; }
      this.报错("该值不能按下标赋值", 节点);
    }
    this.报错("无法赋值的对象", 节点);
  }

  /* ---------- 内置函数注册 ---------- */
  注册内置函数() {
    const 内建 = 内置函数表(this.运行时);
    for (const [名, fn] of Object.entries(内建)) {
      this.全局.定义(名, fn);
    }
    // 注册当前方言的内建函数别名（繁体「長度」、拼音「changdu」等 → 同一实现），
    // 否则繁体/拼音程序调用这些函数会报「未定义的名称」
    const 方言 = typeof 取方言 === "function" ? 取方言() : null;
    if (方言 && 方言.内建函数) {
      for (const [别名, 标准名] of Object.entries(方言.内建函数)) {
        if (内建[标准名] && !this.全局.变量.has(别名)) this.全局.定义(别名, 内建[标准名]);
      }
    }
  }
}

/* ==================== 值工具 ==================== */

function 真值(值) {
  if (值 === null || 值 === undefined) return false;
  if (typeof 值 === "boolean") return 值;
  if (typeof 值 === "number") return 值 !== 0;
  if (typeof 值 === "string") return 值.length > 0;
  if (值.__类型 === "列表") return 值.数据.length > 0;
  if (值.__类型 === "字典") return Object.keys(值.数据).length > 0;
  return true;
}

function 转数字(值) {
  if (typeof 值 === "number") return 值;
  if (typeof 值 === "boolean") return 值 ? 1 : 0;
  if (值 === null) return 0;
  const n = parseFloat(值);
  return isNaN(n) ? 0 : n;
}

function 格式化值(值, 深度 = 0) {
  if (值 === null || 值 === undefined) return "空";
  if (typeof 值 === "boolean") return 值 ? "真" : "假";
  if (typeof 值 === "number") return String(值);
  if (typeof 值 === "string") return 值;
  if (值.__类型 === "列表") {
    if (深度 > 3) return "[…]";
    return "[" + 值.数据.map(v => 格式化值(v, 深度 + 1)).join(", ") + "]";
  }
  if (值.__类型 === "字典") {
    if (深度 > 3) return "{…}";
    const 条目 = Object.entries(值.数据).map(([k, v]) => `${k}: ${格式化值(v, 深度 + 1)}`);
    return "{" + 条目.join(", ") + "}";
  }
  if (值.__类型 === "函数") return `〈函数 ${值.名字 || "匿名"}〉`;
  if (值.__类型 === "类") return `〈类 ${值.名字}〉`;
  if (值.__类型 === "实例") return `〈${值.类.名字} 实例〉`;
  if (值.__类型 === "实例方法") return `〈方法 ${值.函数.名字}〉`;
  return String(值);
}

function 相加(左, 右, 解释器, 节点) {
  if (typeof 左 === "string" || typeof 右 === "string") {
    return 格式化值(左) + 格式化值(右);
  }
  if (左 && 左.__类型 === "列表" && 右 && 右.__类型 === "列表") {
    return { __类型: "列表", 数据: 左.数据.concat(右.数据) };
  }
  if (typeof 左 === "number" && typeof 右 === "number") return 左 + 右;
  return 转数字(左) + 转数字(右);
}

function 相等(左, 右) {
  if ((左 && 左.__类型 === "列表") || (右 && 右.__类型 === "列表") ||
      (左 && 左.__类型 === "字典") || (右 && 右.__类型 === "字典")) {
    try { return JSON.stringify(归一(左)) === JSON.stringify(归一(右)); }
    catch (e) { return 左 === 右; }
  }
  return 左 === 右;
}

function 归一(值) {
  if (值 === null) return null;
  if (值.__类型 === "列表") return 值.数据.map(归一);
  if (值.__类型 === "字典") { const o = {}; for (const k in 值.数据) o[k] = 归一(值.数据[k]); return o; }
  return 值;
}

function 可迭代(值, 解释器) {
  if (值.__类型 === "列表") return 值.数据;
  if (值.__类型 === "字典") return Object.values(值.数据);
  if (typeof 值 === "string") return 值.split("");
  if (typeof 值 === "number") { const a = []; for (let i = 0; i < 值; i++) a.push(i); return a; }
  if (值 === null) return [];
  解释器.报错("这个值不能用于「在」循环");
  return [];
}

function 取成员(对象, 名字, 解释器, 节点) {
  if (对象.__类型 === "实例") {
    if (对象.字段.has(名字)) return 对象.字段.get(名字);
    const 方法节点 = 对象.类.方法.get(名字);
    if (方法节点) {
      const 函数值 = { __类型: "函数", 名字, 参数: 方法节点.参数, 体: 方法节点.体, 环境: 对象.类.环境 };
      return { __类型: "实例方法", 函数: 函数值, 实例: 对象 };
    }
    解释器.报错(`实例「${对象.类.名字}」没有成员「${名字}」`, 节点);
  }
  if (对象.__类型 === "字典") {
    if (名字 in 对象.数据) return 对象.数据[名字];
    解释器.报错(`字典中没有键「${名字}」`, 节点);
  }
  if (对象.__类型 === "列表") {
    if (名字 === "长度") return 对象.数据.length;
    解释器.报错(`列表没有成员「${名字}」`, 节点);
  }
  解释器.报错("该值不能访问成员", 节点);
  return null;
}

<script>/* ============================================================
 * 中文程 · 标准库 (stdlib.js)
 * ------------------------------------------------------------
 * 全部为中文命名的内置函数：数学、文本、列表、字典、绘图、
 * 文件、时间等。所有函数由我们自己实现，宿主能力（画布、
 * 文件）通过 运行时 回调接入界面。
 *
 * 函数约定：fn(参数数组, 解释器) → 返回值
 * ============================================================ */

function 内置函数表(运行时) {
  const F = {};

  /* ---------- 类型与转换 ---------- */
  F.长度 = (p) => {
    const 值 = p[0];
    if (值 && 值.__类型 === "列表") return 值.数据.length;
    if (值 && 值.__类型 === "字典") return Object.keys(值.数据).length;
    if (typeof 值 === "string") return 值.length;
    if (typeof 值 === "number") return String(值).length;
    if (值 === null) return 0;
    return 格式化值(值).length;
  };

  F.类型 = (p) => {
    const 值 = p[0];
    if (值 === null) return "空";
    if (typeof 值 === "number") return "数字";
    if (typeof 值 === "string") return "文本";
    if (typeof 值 === "boolean") return "逻辑";
    if (值.__类型 === "列表") return "列表";
    if (值.__类型 === "字典") return "字典";
    if (值.__类型 === "函数") return "函数";
    if (值.__类型 === "类") return "类";
    if (值.__类型 === "实例") return 值.类.名字;
    return "未知";
  };

  F.转文本 = (p) => 格式化值(p[0]);
  F.转数字 = (p) => {
    const n = parseFloat(格式化值(p[0]));
    return isNaN(n) ? 0 : n;
  };

  /* ---------- 数学 ---------- */
  F.取整 = (p) => Math.floor(转数字(p[0]));
  F.绝对值 = (p) => Math.abs(转数字(p[0]));
  F.平方根 = (p) => Math.sqrt(转数字(p[0]));
  F.幂 = (p) => Math.pow(转数字(p[0]), 转数字(p[1] || 1));
  F.随机数 = (p) => {
    const 最小 = 转数字(p[0] || 0), 最大 = 转数字(p[1] || 0);
    if (最小 > 最大) return 最小;
    return Math.floor(Math.random() * (最大 - 最小 + 1)) + 最小;
  };
  F.最大 = (p) => {
    if (p.length === 1 && p[0] && p[0].__类型 === "列表") {
      if (!p[0].数据.length) return 0;
      return Math.max(...p[0].数据.map(转数字));
    }
    if (!p.length) return 0;
    return Math.max(...p.map(转数字));
  };
  F.最小 = (p) => {
    if (p.length === 1 && p[0] && p[0].__类型 === "列表") {
      if (!p[0].数据.length) return 0;
      return Math.min(...p[0].数据.map(转数字));
    }
    if (!p.length) return 0;
    return Math.min(...p.map(转数字));
  };

  /* ---------- 环境 ---------- */
  F.当前目录 = () => (运行时.当前目录 ? 运行时.当前目录() : "");

  /* ---------- 时间 ---------- */
  F.当前时间 = () => {
    const 现 = new Date();
    const 补 = (n) => String(n).padStart(2, "0");
    return `${现.getFullYear()}年${补(现.getMonth() + 1)}月${补(现.getDate())}日 ${补(现.getHours())}:${补(现.getMinutes())}:${补(现.getSeconds())}`;
  };

  /* ---------- 文本 ---------- */
  F.包含 = (p) => {
    const 文本 = p[0] === null ? "" : 格式化值(p[0]);
    const 片段 = p[1] === null ? "" : 格式化值(p[1]);
    return 文本.includes(片段);
  };
  F.替换 = (p) => {
    const 文本 = p[0] === null ? "" : 格式化值(p[0]);
    const 旧 = p[1] === null ? "" : 格式化值(p[1]);
    const 新 = p[2] === null ? "" : 格式化值(p[2]);
    return 文本.split(旧).join(新);
  };
  F.分割 = (p) => {
    const 文本 = p[0] === null ? "" : 格式化值(p[0]);
    const 分隔符 = p[1] === null || p[1] === undefined ? "" : 格式化值(p[1]);
    const 部分 = 文本.split(分隔符);
    return { __类型: "列表", 数据: 部分 };
  };
  F.重复 = (p) => {
    const 文本 = p[0] === null ? "" : 格式化值(p[0]);
    const n = Math.max(0, Math.floor(转数字(p[1] || 0)));
    return 文本.repeat(n);
  };
  F.范围 = (p) => {
    const 起点 = Math.floor(转数字(p[0] || 0));
    const 终点 = Math.floor(转数字(p[1] || 0));
    const 数据 = [];
    for (let i = 起点; i <= 终点; i++) 数据.push(i);
    return { __类型: "列表", 数据 };
  };

  /* ---------- 列表 ---------- */
  F.追加 = (p, 解释器) => {
    const 列表 = p[0];
    if (!列表 || 列表.__类型 !== "列表") 解释器.报错("「追加」的第一个参数必须是列表");
    列表.数据.push(p[1]);
    return 列表;
  };
  F.删除 = (p, 解释器) => {
    const 列表 = p[0];
    if (!列表 || 列表.__类型 !== "列表") 解释器.报错("「删除」的第一个参数必须是列表");
    const i = Math.floor(转数字(p[1]));
    if (i < 0 || i >= 列表.数据.length) 解释器.报错(`删除的索引 ${i} 超出范围`);
    列表.数据.splice(i, 1);
    return 列表;
  };
  F.排序 = (p) => {
    const 列表 = p[0];
    if (!列表 || 列表.__类型 !== "列表") return 列表;
    return { __类型: "列表", 数据: 列表.数据.slice().sort((a, b) => 转数字(a) - 转数字(b)) };
  };
  F.反转 = (p) => {
    const 列表 = p[0];
    if (!列表 || 列表.__类型 !== "列表") return 列表;
    return { __类型: "列表", 数据: 列表.数据.slice().reverse() };
  };

  /* ---------- 画布绘图 ---------- */
  F.画布 = (p, 解释器) => 运行时.画布(转数字(p[0] || 400), 转数字(p[1] || 300), 格式化值(p[2] || "画布"));
  F.清空画布 = () => 运行时.清空画布();
  F.填充色 = (p) => { 运行时.填充色(格式化值(p[0])); return null; };
  F.笔画色 = (p) => { 运行时.笔画色(格式化值(p[0])); return null; };
  F.画点 = (p) => { 运行时.画点(转数字(p[0]), 转数字(p[1]), 转数字(p[2] || 2)); return null; };
  F.画线 = (p) => { 运行时.画线(转数字(p[0]), 转数字(p[1]), 转数字(p[2]), 转数字(p[3])); return null; };
  F.画圆 = (p) => { 运行时.画圆(转数字(p[0]), 转数字(p[1]), 转数字(p[2] || 20)); return null; };
  F.画矩形 = (p) => { 运行时.画矩形(转数字(p[0]), 转数字(p[1]), 转数字(p[2]), 转数字(p[3])); return null; };
  F.画弧 = (p) => { 运行时.画弧(转数字(p[0]), 转数字(p[1]), 转数字(p[2]), 转数字(p[3]), 转数字(p[4]), 转数字(p[5])); return null; };
  F.写字 = (p) => { 运行时.写字(格式化值(p[0]), 转数字(p[1]), 转数字(p[2]), 转数字(p[3] || 14)); return null; };
  F.画多边形 = (p, 解释器) => {
    const 点 = p[0];
    if (!点 || 点.__类型 !== "列表") 解释器.报错("「画多边形」需要传入坐标点列表");
    const 坐标 = 点.数据.map(v => { if (v && v.__类型 === "列表") return [转数字(v.数据[0]), 转数字(v.数据[1])]; return [0, 0]; });
    运行时.画多边形(坐标);
    return null;
  };

  /* ---------- 文件（通过界面回调，存于浏览器本地） ---------- */
  F.读文件 = (p, 解释器) => {
    const 内容 = 运行时.读文件(格式化值(p[0]));
    if (内容 === null) 解释器.报错(`文件「${格式化值(p[0])}」不存在`);
    return 内容;
  };
  F.写文件 = (p) => { 运行时.写文件(格式化值(p[0]), 格式化值(p[1])); return null; };

  return F;
}

  const 链接 = document.createElement("a");
  链接.href = URL.createObjectURL(块);
  链接.download = 名.endsWith(".zy") ? 名 : 名 + ".zy";
  链接.click();
  setTimeout(() => URL.revokeObjectURL(链接.href), 3000);
}

function 导入文件(file, 回调) {
  const 读者 = new FileReader();
  读者.onload = () => 回调(file.name.replace(/\.zy$/i, ""), 读者.result.replace(/^\ufeff/, ""));
  读者.readAsText(file, "utf-8");

<script>/* ============================================================
 * 中文程 · 代码编辑器 (editor.js)
 * ------------------------------------------------------------
 * 完全自研的轻量中文代码编辑器：
 *   - 双层结构：底层 <pre> 渲染语法高亮，上层 <textarea> 接收输入
 *   - 中文语法高亮（复用自研词法分析器，含注释）
 *   - 行号、自动缩进、Tab 缩进
 *   - 智能补全（关键词 / 中文内建函数 / 用户变量）
 *   - 光标行列状态
 * ============================================================ */

class 中文编辑器 {
  constructor(容器, 选项) {
    this.容器 = 容器;
    this.选项 = 选项 || {};
    this.方言 = 选项.方言 || "zh";

    this.容器.innerHTML = `
      <div class="editor-shell">
        <div class="editor-gutter"></div>
        <div class="editor-body">
          <pre class="editor-highlight" aria-hidden="true"></pre>
          <textarea class="editor-input" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>
      <div class="editor-complete" hidden></div>
    `;

    this.壳 = this.容器.querySelector(".editor-shell");
    this.行号栏 = this.容器.querySelector(".editor-gutter");
    this.高亮层 = this.容器.querySelector(".editor-highlight");
    this.输入区 = this.容器.querySelector(".editor-input");
    this.补全层 = this.容器.querySelector(".editor-complete");

    this.补全候选 = [];
    this.补全选中 = -1;
    this.补全起点 = -1;
    this.高亮定时器 = null;

    this.绑定事件();
  }

  绑定事件() {
    const ta = this.输入区;

    ta.addEventListener("input", () => {
      this.排程高亮();
      this.同步滚动();
      this.更新行号栏();
      this.触发补全();
    });

    ta.addEventListener("scroll", () => this.同步滚动());
    ta.addEventListener("keydown", (e) => this.处理按键(e));
    ta.addEventListener("keyup", () => {
      this.更新状态栏();
      this.更新补全高亮();
    });
    ta.addEventListener("click", () => {
      this.更新状态栏();
      this.补全层.hidden = true;
    });

    // 全局快捷键（运行时由 main 注册）
  }

  /* ---------- 内容 ---------- */
  取值() { return this.输入区.value; }
  设值(文本) {
    this.输入区.value = 文本;
    this.高亮();
    this.更新行号栏();
    this.同步滚动();
    this.输入区.focus();
  }

  /* ---------- 滚动与行号 ---------- */
  同步滚动() {
    this.高亮层.scrollTop = this.输入区.scrollTop;
    this.高亮层.scrollLeft = this.输入区.scrollLeft;
    this.行号栏.scrollTop = this.输入区.scrollTop;
  }

  更新行号栏() {
    const 行数 = this.输入区.value.split("\n").length;
    let html = "";
    for (let i = 1; i <= 行数; i++) html += i + "\n";
    this.行号栏.textContent = html;
  }

  /* ---------- 语法高亮 ---------- */
  排程高亮() {
    clearTimeout(this.高亮定时器);
    this.高亮定时器 = setTimeout(() => this.高亮(), 120);
  }

  高亮() {
    const 源码 = this.输入区.value;
    if (!源码) { this.高亮层.textContent = ""; return; }
    try {
      this.高亮层.innerHTML = 着色(源码, 取方言());
    } catch (e) {
      this.高亮层.textContent = 源码;
    }
  }

  /* ---------- 编辑行为 ---------- */
  处理按键(e) {
    const ta = this.输入区;
    /* 补全选择 */
    if (!this.补全层.hidden) {
      if (e.key === "ArrowDown") { e.preventDefault(); this.补全选中 = (this.补全选中 + 1) % this.补全候选.length; this.更新补全高亮(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); this.补全选中 = (this.补全选中 - 1 + this.补全候选.length) % this.补全候选.length; this.更新补全高亮(); return; }
      if (e.key === "Enter" || e.key === "Tab") {
        if (this.补全选中 >= 0) {
          e.preventDefault();
          this.接受补全();
          return;
        }
      }
      if (e.key === "Escape") { this.补全层.hidden = true; return; }
    }

    if (e.key === "Tab") {
      e.preventDefault();
      ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input"));
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const 开始 = ta.selectionStart;
      const 行首 = ta.value.lastIndexOf("\n", 开始 - 1) + 1;
      const 前导 = ta.value.slice(行首, 开始).match(/^[ \t]*/)[0];
      // 若上一行以 { 结尾，缩进加深
      const 上一行 = ta.value.slice(行首, 开始);
      let 额外 = "";
      if (/\{\s*$/.test(上一行)) 额外 = "    ";
      const 插入 = "\n" + 前导 + 额外;
      ta.setRangeText(插入, 开始, ta.selectionEnd, "end");
      ta.dispatchEvent(new Event("input"));
      return;
    }
  }

  /* ---------- 智能补全 ---------- */
  取候选词() {
    const 方言 = 取方言();
    const 词 = new Set();
    for (const k of Object.keys(方言.词表)) 词.add(k);
    for (const k of Object.keys(方言.内建函数)) 词.add(k);
    // 用户源码中出现的标识符
    try {
      const 词法 = new 词法分析器(this.输入区.value, 方言);
      for (const t of 词法.分析(true)) {
        if (t.类型 === "IDENT") 词.add(t.值);
      }
    } catch (e) { /* 忽略 */ }
    return [...词].sort((a, b) => a.length - b.length);
  }

  触发补全() {
    const ta = this.输入区;
    const 光标 = ta.selectionStart;
    // 提取光标前的"词片段"
    const 前文 = ta.value.slice(0, 光标);
    const 匹配 = 前文.match(/[\u4e00-\u9fff\u3400-\u4dbfa-zA-Z_]+$/);
    if (!匹配 || 匹配[0].length < 1) {
      this.补全层.hidden = true;
      return;
    }
    const 片段 = 匹配[0];
    const 候选 = this.取候选词().filter(w => w.startsWith(片段) && w !== 片段);
    if (候选.length === 0) { this.补全层.hidden = true; return; }
    this.补全候选 = 候选.slice(0, 12);
    this.补全选中 = 0;
    this.补全起点 = 光标 - 片段.length;
    this.渲染补全(ta);
  }

  渲染补全(ta) {
    const 行高 = 20;
    const 行号 = ta.value.slice(0, ta.selectionStart).split("\n").length - 1;
    const 行首 = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1;
    const 列 = ta.selectionStart - 行首;
    const 顶部 = 行号 * 行高 + 行高 - ta.scrollTop;
    const 左侧 = 列 * 8 + 8 - ta.scrollLeft;
    this.补全层.style.top = 顶部 + "px";
    this.补全层.style.left = 左侧 + "px";
    this.补全层.innerHTML = this.补全候选.map((w, i) =>
      `<div class="cc-item${i === this.补全选中 ? " cc-on" : ""}" data-i="${i}">${w}</div>`
    ).join("");
    this.补全层.hidden = false;
  }

  更新补全高亮() {
    if (this.补全层.hidden) return;
    const 项 = this.补全层.querySelectorAll(".cc-item");
    for (let i = 0; i < 项.length; i++) 项[i].classList.toggle("cc-on", i === this.补全选中);
  }

  接受补全() {
    const ta = this.输入区;
    const 词 = this.补全候选[this.补全选中];
    if (!词) return;
    ta.setRangeText(词, this.补全起点, ta.selectionStart, "end");
    this.补全层.hidden = true;
    this.高亮();
    this.更新状态栏();
  }

  /* ---------- 状态栏 ---------- */
  更新状态栏() {
    const fn = this.选项.状态回调;
    if (!fn) return;
    const ta = this.输入区;
    const 前文 = ta.value.slice(0, ta.selectionStart);
    const 行 = 前文.split("\n").length;
    const 行首 = 前文.lastIndexOf("\n") + 1;
    const 列 = ta.selectionStart - 行首 + 1;
    const 总行 = ta.value.split("\n").length;
    fn({ 行, 列, 总行 });
  }

  /* 跳到指定行（用于错误定位） */
  跳到行(n) {
    const ta = this.输入区;
    const 行们 = ta.value.split("\n");
    let 偏移 = 0;
    for (let i = 0; i < Math.min(n - 1, 行们.length); i++) 偏移 += 行们[i].length + 1;
    ta.focus();
    ta.setSelectionRange(偏移, 偏移);
    const 行高 = 20;
    ta.scrollTop = Math.max(0, (n - 1) * 行高 - 60);
    this.同步滚动();
    this.更新状态栏();
  }
}

/* ---------- 着色工具 ---------- */
const 关键词类型 = new Set([
  "VAR", "IF", "ELSE_IF", "ELSE", "WHILE", "FOR", "FUNC", "RETURN",
  "TRUE", "FALSE", "NULL", "AND", "OR", "NOT", "CLASS", "NEW", "PROP",
  "METHOD", "THIS", "FROM", "TO", "IN", "ASGN", "WRITE", "READ", "CLS", "WAIT"
]);

function 转义(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* 着色：复用自研词法分析器得到 token 流，再按源码原文区间拼装 HTML。
 * 字符串 token 需还原引号原文，故逐个计算 token 在源码中的偏移。 */
function 着色(源码, 方言) {
  const 词法 = new 词法分析器(源码, 方言);
  const tokens = 词法.分析(true);
  const 内建 = new Set(Object.keys(方言.内建函数));

  const 带位置 = [];
  let 偏移 = 0;
  for (const t of tokens) {
    let 长度;
    if (t.类型 === "NUMBER") 长度 = String(t.值).length;
    else if (t.类型 === "STRING") 长度 = 引号串长度(源码.slice(偏移));
    else 长度 = (t.值 === null || t.值 === undefined) ? 0 : String(t.值).length;
    t.偏移 = 偏移;
    t.原文长度 = 长度;
    偏移 += 长度;
    带位置.push(t);
  }

  let html = "";
  let 上次 = 0;
  for (const t of 带位置) {
    if (t.类型 === "EOF") break;
    if (t.偏移 < 上次) continue;
    const 原文 = 源码.slice(t.偏移, Math.min(t.偏移 + t.原文长度, 源码.length));
    let 类 = "";
    if (t.类型 === "COMMENT") 类 = "tk-comment";
    else if (关键词类型.has(t.类型)) 类 = "tk-keyword";
    else if (t.类型 === "NUMBER") 类 = "tk-number";
    else if (t.类型 === "STRING") 类 = "tk-string";
    else if (t.类型 === "IDENT") 类 = 内建.has(t.值) ? "tk-func" : "tk-ident";
    else 类 = "tk-op";
    html += 转义(源码.slice(上次, t.偏移));
    html += 类 ? `<span class="${类}">` + 转义(原文) + "</span>" : 转义(原文);
    上次 = t.偏移 + t.原文长度;
  }
  const 剩余 = 源码.slice(上次);
  if (剩余) html += 转义(剩余);
  return html;
}

/* 计算源码片段起始处引号字符串的实际长度（含引号与转义） */
function 引号串长度(片段) {
  const 引号 = 片段[0];
  if (引号 !== '"' && 引号 !== "'") return 0;
  let i = 1;
  while (i < 片段.length) {
    if (片段[i] === "\\") { i += 2; continue; }
    if (片段[i] === 引号) return i + 1;
    i++;
  }
  return 片段.length;
}
</script>
<script>/* ============================================================
 * 中文程 · AI 辅助 (ai.js)
 * ------------------------------------------------------------
 * 内置 AI 编程助手，两种模式：
 *   1. 联网模式：接入豆包大模型（火山方舟，OpenAI 兼容接口），
 *      支持 对话 / 生成代码 / 解释代码 / 修复错误，流式输出。
 *   2. 离线模式：不联网也能用的规则教学助手 + 内置模板库。
 * 所有设置仅保存在本机浏览器（localStorage），不上传任何内容。
 * ============================================================ */

const AI存储键 = "中程AI设置";

class 中文AI {
  constructor(面板, 选项) {
    this.面板 = 面板;
    this.选项 = 选项 || {};   // { 取源码, 插入代码, 取方言名 }
    this.历史 = [];
    this.设置 = this.读设置();
    this.构建界面();
  }

  读设置() {
    try {
      return JSON.parse(localStorage.getItem(AI存储键)) || { 地址: "", 密钥: "", 模型: "doubao-seed-1.6", 温度: 0.6 };
    } catch (e) { return { 地址: "", 密钥: "", 模型: "doubao-seed-1.6", 温度: 0.6 }; }
  }

  存设置() {
    localStorage.setItem(AI存储键, JSON.stringify(this.设置));
  }

  可用() { return this.设置.地址 && this.设置.密钥 && this.设置.模型; }

  /* ---------- 界面 ---------- */
  构建界面() {
    this.面板.innerHTML = `
      <div class="ai-head">
        <span class="ai-title">AI 编程助手</span>
        <button class="ai-gear" title="设置">⚙</button>
      </div>
      <div class="ai-tools">
        <button data-act="对话">对话</button>
        <button data-act="生成">生成代码</button>
        <button data-act="解释">解释代码</button>
        <button data-act="修复">修复错误</button>
      </div>
      <div class="ai-msgs"></div>
      <div class="ai-input">
        <textarea placeholder="向 AI 助手提问，例如：帮我写一个猜数字游戏…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="ai-send">发送</button>
      </div>
      <div class="ai-setup" hidden>
        <div class="ai-setup-title">AI 设置（仅保存在本机）</div>
        <label>接口地址（豆包方舟示例）</label>
        <input class="set-addr" placeholder="https://ark.cn-beijing.volces.com/api/v3">
        <label>API 密钥</label>
        <input class="set-key" type="password" placeholder="粘贴你的 API Key">
        <label>模型名称</label>
        <input class="set-model" placeholder="doubao-seed-1.6">
        <label>创造度（0~2）</label>
        <input class="set-temp" type="number" step="0.1" min="0" max="2">
        <div class="ai-setup-btns">
          <button class="set-save">保存</button>
          <button class="set-close">关闭</button>
        </div>
        <div class="ai-setup-tip">没有密钥？关闭设置即可使用离线教学助手。</div>
      </div>
    `;

    this.消息区 = this.面板.querySelector(".ai-msgs");
    this.输入框 = this.面板.querySelector(".ai-input textarea");
    this.设置面板 = this.面板.querySelector(".ai-setup");

    /* 事件 */
    this.面板.querySelector(".ai-gear").onclick = () => {
      const 显 = this.设置面板.hidden;
      this.设置面板.hidden = !显;
      if (显) this.填入设置();
    };
    this.面板.querySelector(".set-close").onclick = () => { this.设置面板.hidden = true; };
    this.面板.querySelector(".set-save").onclick = () => this.保存设置();

    this.面板.querySelectorAll(".ai-tools button").forEach(b => {
      b.onclick = () => {
        const 操作 = b.dataset.act;
        if (操作 === "对话") this.输入框.focus();
        else if (操作 === "生成") this.生成代码();
        else if (操作 === "解释") this.解释代码();
        else if (操作 === "修复") this.修复错误();
      };
    });

    this.面板.querySelector(".ai-send").onclick = () => this.发送();
    this.输入框.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.发送(); }
    });
  }

  填入设置() {
    this.面板.querySelector(".set-addr").value = this.设置.地址 || "";
    this.面板.querySelector(".set-key").value = this.设置.密钥 || "";
    this.面板.querySelector(".set-model").value = this.设置.模型 || "";
    this.面板.querySelector(".set-temp").value = this.设置.温度 ?? 0.6;
  }

  保存设置() {
    this.设置.地址 = this.面板.querySelector(".set-addr").value.trim();
    this.设置.密钥 = this.面板.querySelector(".set-key").value.trim();
    this.设置.模型 = this.面板.querySelector(".set-model").value.trim() || "doubao-seed-1.6";
    this.设置.温度 = parseFloat(this.面板.querySelector(".set-temp").value) || 0.6;
    this.存设置();
    this.设置面板.hidden = true;
    this.加消息("系统", this.可用() ? "✅ AI 设置已保存，联网助手已就绪。" : "设置已保存。密钥为空时将使用离线教学助手。");
  }

  /* ---------- 消息渲染 ---------- */
  加消息(角色, 内容, 流式 = false) {
    const 行 = document.createElement("div");
    行.className = "ai-msg ai-" + (角色 === "用户" ? "user" : 角色 === "系统" ? "sys" : "bot");
    const 内容盒 = document.createElement("div");
    内容盒.className = "ai-msg-body";
    if (角色 === "用户") 内容盒.textContent = 内容;
    else 内容盒.innerHTML = this.渲染内容(内容);
    行.appendChild(内容盒);
    this.消息区.appendChild(行);
    this.消息区.scrollTop = this.消息区.scrollHeight;
    return 内容盒;
  }

  渲染内容(文本) {
    // 简单转义并支持代码块与换行
    let s = 文本.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    s = s.replace(/```([\s\S]*?)```/g, (m, 代码) =>
      `<pre class="ai-code">${转义(代码)}</pre>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return s.replace(/\n/g, "<br>");
  }

  打字输出(内容盒, 全文) {
    内容盒.innerHTML = this.渲染内容(全文);
    this.消息区.scrollTop = this.消息区.scrollHeight;
  }

  /* ---------- 发送（对话模式） ---------- */
  async 发送() {
    const 文本 = this.输入框.value.trim();
    if (!文本) return;
    this.输入框.value = "";
    this.加消息("用户", 文本);
    if (!this.可用()) { this.离线教学(文本); return; }
    await this.请求AI([...this.历史, { role: "user", content: 文本 }], true, (全文) => {
      this.历史 = [{ role: "user", content: 文本 }, { role: "assistant", content: 全文 }];
    });
  }

  /* ---------- 快捷功能 ---------- */
  生成代码() {
    const 需求 = window.prompt("描述你想生成的程序需求（例如：打印九九乘法表）：", "打印九九乘法表");
    if (需求 === null) return;
    this.加消息("用户", "【生成代码】" + 需求);
    if (!this.可用()) { this.离线模板(需求); return; }
    this.请求AI([{ role: "user", content: `请用「${this.选项.取方言名()}」语言写一个完整程序：${需求}。只输出代码，代码放在代码块中，并简要说明功能。` }], false);
  }

  解释代码() {
    const 选中 = window.getSelection() && window.getSelection().toString().trim();
    const 源码 = 选中 || this.选项.取源码();
    if (!源码) { this.加消息("系统", "编辑器里还没有代码可以解释。"); return; }
    this.加消息("用户", "【解释代码】\n" + 源码.slice(0, 300) + (源码.length > 300 ? "…" : ""));
    if (!this.可用()) { this.离线讲解(源码); return; }
    this.请求AI([{ role: "user", content: `请用中文逐段解释这段「${this.选项.取方言名()}」代码做了什么，讲清楚每一步：\n\`\`\`\n${源码}\n\`\`\`` }], false);
  }

  修复错误() {
    const 源码 = this.选项.取源码();
    if (!源码) { this.加消息("系统", "编辑器里还没有代码。"); return; }
    this.加消息("用户", "【修复错误】正在检查当前代码中的问题…");
    if (!this.可用()) {
      // 离线：尝试用真实解析器诊断
      const 诊断 = this.离线诊断(源码);
      this.加消息("助手", 诊断);
      return;
    }
    this.请求AI([{ role: "user", content: `请审查这段「${this.选项.取方言名()}」代码中的错误并给出修正后的完整代码（放在代码块中）：\n\`\`\`\n${源码}\n\`\`\`` }], false);
  }

  /* ---------- 联网请求 ---------- */
  系统提示词() {
    return `你是「中文程」中文编程软件内置的 AI 编程助手。「中文程」是一种完全自主开发的中文编程语言，语法示例：
# 注释
写("你好，世界")              # 输出
设 x = 10                    # 定义变量
如果 x > 5 { 写("大") } 否则 { 写("小") }
对于 i 从 1 到 10 { 写(i) }   # 数字循环
对于 i 在 [1,2,3] { 写(i) }   # 遍历列表
函数 平方(数) { 返回 数 * 数 } # 定义函数
类 动物 { 属性 名字 = "猫"; 方法 叫() { 写(本.名字) } }
写(平方(6))                  # 调用函数
列表用 [1,2,3]，字典用 {键: 值}，逻辑值用 真/假，空值用 空。
标准库：长度 类型 转文本 转数字 取整 绝对值 随机数 当前时间 包含 替换 分割 追加 删除 排序 反转 画布 画圆 画线 画矩形 填充色 笔画色 读入 等待 清屏 等。
请始终使用这种中文语法回答问题，代码放在 \`\`\` 代码块中。回答用简体中文，简洁清晰。`;
  }

  async 请求AI(messages, 记历史, 完成回调) {
    const 盒 = this.加消息("助手", "思考中…");
    const 完整消息 = [{ role: "system", content: this.系统提示词() }].concat(messages);
    try {
      const 地址 = (this.设置.地址 || "https://ark.cn-beijing.volces.com/api/v3").replace(/\/+$/, "");
      const 响应 = await fetch(地址 + "/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + this.设置.密钥
        },
        body: JSON.stringify({
          model: this.设置.模型,
          messages: 完整消息,
          temperature: this.设置.温度,
          stream: true
        })
      });
      if (!响应.ok) {
        const 错误 = await 响应.text().catch(() => "");
        throw new Error("请求失败（" + 响应.status + "）" + 错误.slice(0, 200));
      }
      const 全文 = await this.读取流(响应, 盒);
      if (完成回调) 完成回调(全文);
    } catch (e) {
      盒.innerHTML = `<span class="ai-err">❌ ${转义(e.message || "网络错误")}</span><br>请检查 AI 设置（⚙）中的接口地址、密钥和模型名称。`;
    }
  }

  async 读取流(响应, 盒) {
    const 阅读器 = 响应.body.getReader();
    const 解码器 = new TextDecoder();
    let 缓冲 = "";
    let 全文 = "";
    while (true) {
      const { done, value } = await 阅读器.read();
      if (done) break;
      缓冲 += 解码器.decode(value, { stream: true });
      const 行们 = 缓冲.split("\n");
      缓冲 = 行们.pop();
      for (const 行 of 行们) {
        const 净 = 行.trim();
        if (!净.startsWith("data:")) continue;
        const 数据 = 净.slice(5).trim();
        if (数据 === "[DONE]") continue;
        try {
          const json = JSON.parse(数据);
          const 增量 = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
          if (增量) { 全文 += 增量; this.打字输出(盒, 全文); }
        } catch (e) { /* 忽略不完整行 */ }
      }
    }
    return 全文;
  }

  /* ================= 离线助手 ================= */

  离线教学(文本) {
    const 需求 = 文本.toLowerCase();
    if (需求.includes("语法") || 需求.includes("怎么写") || 需求.includes("入门") || 需求.includes("怎么用")) {
      this.加消息("助手", this.语法速览());
      return;
    }
    if (需求.includes("循环") || 需求.includes("遍历")) {
      this.加消息("助手", this.循环讲解());
      return;
    }
    if (需求.includes("函数")) {
      this.加消息("助手", this.函数讲解());
      return;
    }
    if (需求.includes("类") || 需求.includes("对象")) {
      this.加消息("助手", this.类讲解());
      return;
    }
    // 尝试按关键词匹配内置模板
    const 模板 = 找模板(文本);
    if (模板) {
      this.加消息("助手", `离线模式下为你找到内置示例「${模板.名}」，已为你打开。想生成新程序，请配置 AI 密钥后使用「生成代码」。`);
      this.选项.打开示例(模板.名);
      return;
    }
    this.加消息("助手", this.语法速览());
  }

  离线模板(需求) {
    const 模板 = 找模板(需求);
    if (模板) {
      this.加消息("助手", `离线模式下从内置示例库匹配到「${模板.名}」，已为你打开，可在此基础上修改。`);
      this.选项.打开示例(模板.名);
    } else {
      this.加消息("助手", "离线模式暂无法凭空生成代码。请配置 AI 密钥（⚙ 设置）使用联网生成，或从左侧「示例」挑选一个内置程序学习修改。");
    }
  }

  离线讲解(源码) {
    // 规则引擎逐行讲解
    const 行们 = 源码.split("\n");
    const 讲解 = [];
    let 解释器说明 = "以下按行讲解这段「中文程」代码：\n";
    const 方言 = 取方言();
    for (let i = 0; i < 行们.length; i++) {
      const 行 = 行们[i].trim();
      if (!行) continue;
      if (行.startsWith("#") || 行.startsWith("//")) { 讲解.push(`第 ${i + 1} 行：注释，不执行`); continue; }
      if (行.startsWith("写") || 行.startsWith("打印")) { 讲解.push(`第 ${i + 1} 行：向控制台输出内容`); continue; }
      if (行.startsWith("设") || 行.startsWith("令")) { 讲解.push(`第 ${i + 1} 行：定义变量并（可选）赋初值`); continue; }
      if (行.startsWith("如果")) { 讲解.push(`第 ${i + 1} 行：条件判断，满足条件时执行后面的块`); continue; }
      if (行.startsWith("否则")) { 讲解.push(`第 ${i + 1} 行：上面条件都不满足时执行`); continue; }
      if (行.startsWith("当")) { 讲解.push(`第 ${i + 1} 行：循环——只要条件为真就反复执行`); continue; }
      if (行.startsWith("对于")) { 讲解.push(`第 ${i + 1} 行：循环——逐个遍历列表或数字范围`); continue; }
      if (行.startsWith("函数")) { 讲解.push(`第 ${i + 1} 行：定义函数（可反复调用的一段逻辑）`); continue; }
      if (行.startsWith("返回")) { 讲解.push(`第 ${i + 1} 行：结束函数并返回一个值`); continue; }
      if (行.startsWith("类")) { 讲解.push(`第 ${i + 1} 行：定义一个类（属性 + 方法的模板）`); continue; }
      if (行.startsWith("属性")) { 讲解.push(`第 ${i + 1} 行：声明类的字段`); continue; }
      if (行.startsWith("方法")) { 讲解.push(`第 ${i + 1} 行：声明类的方法`); continue; }
      if (行.includes("=")) { 讲解.push(`第 ${i + 1} 行：给变量赋值`); continue; }
      讲解.push(`第 ${i + 1} 行：执行语句`);
    }
    this.加消息("助手", 解释器说明 + 讲解.join("\n"));
  }

  离线诊断(源码) {
    try {
      解析源码(源码, 取方言());
      return "✅ 离线检查通过：这段代码语法上没有明显问题。运行看看结果是否符合预期吧。";

对于 名字 在 ["小明","小红"] { 写(名字) }

# 函数

# 类
